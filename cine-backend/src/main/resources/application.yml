# Configuración de la aplicación; ${VAR:default} toma el valor de desarrollo si falta la variable de entorno
# Sin perfil activo corre contra MySQL; los tests activan `test` (application-test.yml, H2)

spring:
  application:
    name: cine

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appsinteractivas}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      # Diez conexiones alcanzan: el límite son las consultas en vuelo, no los usuarios. Aiven free pide menos (5).
      maximum-pool-size: ${DB_POOL:10}
      pool-name: cine

  jpa:
    hibernate:
      # schema.sql crea la base si el volumen está vacío y las migraciones son a mano; `validate` frena el arranque si entidad y tabla difieren
      ddl-auto: validate
    # Sin sesión abierta durante la respuesta: las entidades se leen completas en el servicio
    # (colecciones y los tres @ManyToOne que las vistas leen afuera son EAGER)
    open-in-view: false
    properties:
      hibernate:
        # Las colecciones EAGER y los LAZY de una lista se cargan de a 50 ids por IN, no uno por fila.
        default_batch_fetch_size: 50

  servlet:
    multipart:
      # Por encima de los 2 MB de Imagen: hasta acá el archivo llega y el 400 lo explica Imagen.
      max-file-size: 3MB
      max-request-size: 3MB

  jackson:
    deserialization:
      # Un campo de más en el pedido no se rechaza
      fail-on-unknown-properties: false
      # Sin estas dos, Jackson convierte en silencio ({"peliculaId": 1.9} programaba la 1): mejor un 400
      accept-float-as-int: false
      fail-on-numbers-for-enums: true

server:
  port: ${PORT:8080}
  # Detrás de nginx o del proxy de Render: X-Forwarded-Proto hace https las URLs y Secure la cookie.
  forward-headers-strategy: native
  tomcat:
    # Tras el 400 de multipart Tomcat cierra; si no drena el cuerpo entero, el cliente recibe un reset y no el 400.
    max-swallow-size: 4MB

# La documentación de la API, generada desde los @RestController. En producción CINE_SWAGGER=false: no publica el mapa de la API.
springdoc:
  api-docs:
    enabled: ${CINE_SWAGGER:true}
    # El JSON de OpenAPI. nginx lo proxea junto con /swagger-ui.
    path: /v3/api-docs
  swagger-ui:
    enabled: ${CINE_SWAGGER:true}
    path: /swagger-ui.html
    # Por ruta: el orden no cambia al agregar un controlador
    operations-sorter: method
    tags-sorter: alpha
    # Sin modelos desplegados: son 65 DTO y tapan los endpoints
    default-models-expand-depth: -1

# Lo propio del cine, con el mismo prefijo para todo. Cada sección la lee un record
# @ConfigurationProperties (Propiedades*) al lado de la clase que la usa.
cine:
  comprobantes:
    # Relativos al working dir. En Docker es /app, y el Dockerfile crea /app/tickets.
    tickets: ${CINE_TICKETS:tickets}
  importador:
    # Pasado este tiempo una corrida EN_CURSO se da por perdida (backend reiniciado a mitad)
    corrida-maxima: 5m
    # El mínimo entre dos corridas seguidas, que es la protección contra el doble clic.
    espera-entre-corridas: 60s
  tmdb:
    token: ${TMDB_TOKEN:}
    region: ${TMDB_REGION:AR}
    base: https://api.themoviedb.org/3
  mercadopago:
    # El Access Token de Mercado Pago (credenciales de prueba). Sin él, la pasarela emulada.
    token: ${MP_ACCESS_TOKEN:}
    base: https://api.mercadopago.com
    sitio: ${CINE_URL_PUBLICA:http://localhost:8080}
    # Cada cuánto se le pregunta a MP por los pagos aprobados, por si el comprador no volvió al sitio.
    conciliacion: 60s
  google:
    # El cliente OAuth de Google Cloud con el que entra el cliente de la web. Sin los dos, no hay ingreso de clientes.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  incaa:
    # El encabezado de la declaración jurada. Ficticios: el TP no tiene un exhibidor inscripto.
    razon-social: ${INCAA_RAZON_SOCIAL:Cine UADE S.A.}
    cuit: ${INCAA_CUIT:30-71234567-1}
    numero-exhibidor: ${INCAA_NUMERO_EXHIBIDOR:10452}

logging:
  # Prefijo corto: docker compose logs mezcla cuatro contenedores en una columna
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{0} - %msg%n"
  level:
    # El arranque de Spring y de Tomcat son una decena de líneas que no son del sistema.
    org.springframework: warn
    org.apache: warn
    com.zaxxer.hikari: warn
    ar.uade.cine: info
