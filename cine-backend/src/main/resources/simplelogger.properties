# Como se ve cada linea de log. Lo lee slf4j-simple al arrancar.
#
# Por defecto una linea sale asi:
#     [main] INFO ar.uade.cine.servicio.GestorReservas - reserva 37 creada
# y el 80% del ancho es andamiaje: siempre es el thread main y siempre es el
# mismo paquete. Con la configuracion de abajo queda:
#     16:42:07 INFO  GestorReservas - reserva 37 creada
#
# Importa mas de lo que parece: `docker compose logs` mezcla los cinco
# contenedores en una sola columna, asi que cada caracter de prefijo es uno menos
# de la linea que interesa.

# La hora, sin la fecha: los logs se miran en el dia.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss

# Siempre es main: no aporta nada.
org.slf4j.simpleLogger.showThreadName=false

# GestorReservas en vez de ar.uade.cine.servicio.GestorReservas.
org.slf4j.simpleLogger.showShortLogName=true

# Jetty y Javalin escupen una decena de lineas al arrancar que no son del
# sistema. Se las baja a WARN para que el log del backend sea el del negocio.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.log.io.javalin=warn
