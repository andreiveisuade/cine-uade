roke:#181818;stroke-width:1;"/><path d="M580.895,456.0113 Q580.3139,456.3102 579.6747,456.4596 Q579.0356,456.609 578.33,456.609 Q575.8232,456.609 574.5034,454.9571 Q573.1835,453.3053 573.1835,450.1842 Q573.1835,447.0548 574.5034,445.4029 Q575.8232,443.7511 578.33,443.7511 Q579.0356,443.7511 579.683,443.9005 Q580.3305,444.0499 580.895,444.3488 L580.895,447.0714 Q580.2641,446.4904 579.6706,446.2206 Q579.0771,445.9508 578.4462,445.9508 Q577.1015,445.9508 576.4167,447.0175 Q575.7319,448.0841 575.7319,450.1842 Q575.7319,452.276 576.4167,453.3426 Q577.1015,454.4093 578.4462,454.4093 Q579.0771,454.4093 579.6706,454.1395 Q580.2641,453.8697 580.895,453.2887 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7969" x="598.9218" y="455.1593">GestorPromociones</text><line style="stroke:#181818;stroke-width:0.5;" x1="494.81" x2="802.3305" y1="465.8683" y2="465.8683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.4346" x="499.81" y="483.4034">+crearPorcentaje(...)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.2764" x="499.81" y="499.8917">+crearMontoFijo(...)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.6699" x="499.81" y="516.38">+crearNxM(...)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.9844" x="499.81" y="532.8683">+activar(id)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.7324" x="499.81" y="549.3566">+desactivar(id)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.4053" x="499.81" y="565.8448">+listar(): List&lt;Promocion&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.7568" x="499.81" y="582.3331">+buscar(id): Optional&lt;Promocion&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="297.5205" x="499.81" y="598.8214">+mejorPara(entradas, inicioFuncion, medio)</text><line style="stroke:#181818;stroke-width:1;" x1="494.81" x2="802.3305" y1="605.7745" y2="605.7745"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.2344" x="499.81" y="623.3097">+calcularPara(...): Descuento</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="46" id="ent0013"><path d="M859.76,255.3183 L859.76,341.871 L1173.3743,341.871 L1173.3743,265.3183 L1163.3743,255.3183 L859.76,255.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1163.3743,255.3183 L1163.3743,265.3183 L1173.3743,265.3183 L1163.3743,255.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8706" x="865.76" y="272.8866">cobrar() le pregunta a la interfaz un monto</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5996" x="865.76" y="288.1972">y de que promocion salio, nada mas. No sabe</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.6143" x="865.76" y="303.5077">que existe un ABM de promociones ni que hay</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.2139" x="865.76" y="318.8183">una regla para elegir "la que mas descuenta"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.9902" x="865.76" y="334.1288">(R15): eso vive del otro lado del contrato.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="54" id="ent0016"><path d="M493.4,717.2683 L493.4,819.1316 A0,0 0 0 0 493.4,819.1316 L803.7325,819.1316 A0,0 0 0 0 803.7325,819.1316 L803.7325,727.2683 L793.7325,717.2683 L652.57,717.2683 L648.57,630.6683 L644.57,717.2683 L493.4,717.2683 A0,0 0 0 0 493.4,717.2683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M793.7325,717.2683 L793.7325,727.2683 L803.7325,727.2683 L793.7325,717.2683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.9609" x="499.4" y="734.8366">Implementa PoliticaPromociones ademas de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.2646" x="499.4" y="750.1472">tener el ABM completo: es una interfaz chica</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.4092" x="499.4" y="765.4577">sobre una clase grande, no una clase chica.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.3325" x="499.4" y="780.7683">ISP no dice que GestorPromociones tenga que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.3999" x="499.4" y="796.0788">achicarse; dice que nadie deberia verse</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.8984" x="499.4" y="811.3894">obligado a depender de mas de lo que usa.</text></g><g class="entity" data-qualified-name="N1" data-source-line="63" id="ent0018"><path d="M6,43.4883 L6,145.3516 A0,0 0 0 0 6,145.3516 L169.57,145.3516 L173.57,282.2783 L177.57,145.3516 L341.1328,145.3516 A0,0 0 0 0 341.1328,145.3516 L341.1328,53.4883 L331.1328,43.4883 L6,43.4883 A0,0 0 0 0 6,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M331.1328,43.4883 L331.1328,53.4883 L341.1328,53.4883 L331.1328,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.1328" x="12" y="61.0566">Si GestorPagos dependiera de GestorPromociones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.0835" x="12" y="76.3672">a secas, cualquier cambio en el ABM -otro tipo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.0674" x="12" y="91.6777">de promocion, otro parametro en crearNxM-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5234" x="12" y="106.9883">obligaria a recompilar y volver a probar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.7861" x="12" y="122.2988">GestorPagos, que no toca esas lineas ni le</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.604" x="12" y="137.6094">importan.</text></g><!--link GestorPagos to PoliticaPromociones--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="40" id="lnk8"><path codeLine="40" d="M232.16,298.5983 C269.59,298.5983 315.55,298.5983 366.68,298.5983" fill="none" id="GestorPagos-to-PoliticaPromociones" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="371.68,298.5983,362.68,294.5983,366.68,298.5983,362.68,302.5983,371.68,298.5983" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7109" x="249.99" y="292.1666">depende de esto</text></g><!--reverse link PoliticaPromociones to GestorPromociones--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="extension" data-source-line="41" id="lnk10"><path codeLine="41" d="M588.0115,344.1808 C596.5515,370.5208 604.41,394.7783 616.92,433.3983" fill="none" id="PoliticaPromociones-backto-GestorPromociones" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="582.46,327.0583,582.304,346.0313,593.719,342.3303,582.46,327.0583" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.5098" x="607.58" y="385.4366">implementa esto,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.1641" x="614.7529" y="400.7472">y bastante mas</text></g><!--link PoliticaPromociones to Descuento--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="43" id="lnk11"><path codeLine="43" d="M549.84,327.0583 C511.45,371.4883 439.4094,454.8653 400.8394,499.4953" fill="none" id="PoliticaPromociones-to-Descuento" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="397.57,503.2783,406.4813,499.0843,400.8394,499.4953,400.4284,493.8533,397.57,503.2783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GestorPagos to GMN12--><g class="link" data-entity-1="ent0002" data-entity-2="ent0013" data-link-type="association" data-source-line="46" id="lnk14"><path d="M181.53,282.1983 C197.2,252.0783 235.27,188.8483 289.07,164.8483 C341.12,141.6183 747.27,149.1683 802.07,164.8483 C863.24,182.3583 923.93,222.9383 965.06,254.8383" fill="none" id="GestorPagos-GMN12" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src ZLLDRzj64BtpLmnqgO9AH7teHJKCk0rI6B0TeRhcCY8dz3hBNMPtAKHfyz_xPabJbAq2lTZKxfklDszdaabMQFVn_kxzXdRI16cuCjvHBMHSal2PAucqfihl0mTodfpWn2GciNJx-uCYk-1RhsOIYo9-CQxZm2rLbcEyJIcOVP_ahl9kPxuB_JA3T5nzuKPswOWqWbI9NMEbU3BmAcsNZjHAkvS0lp_HBHAA6kzhZzjl9YOZWMdhhKccukqfYnNzAJ7viEN6gqKdhZQC3tWPRqvWOefISToGPUeTFENC1JMxAaXIExtIg3u5Jqts05UJOt6KVEsLaeYqfEMI_XWOYzxEEEiTkRwLu5VKuI-ndTn86ECCmKNPpq5htZDnOlXFtEuDWW4KXCFMXmeuVfOLtEIZ1--I_s2U4I3_Vlpsi2AkaZbmM250dBuj4jN_-pvM7Cgo1DLQH8GhBTNr3amO