tApplication + main()).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.0239" x="228.21" y="99.3377">Cada @Service, @Repository y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.6235" x="228.21" y="114.6483">@RestController se conecta solo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.5483" x="228.21" y="129.9588">por component scan.</text></g><g class="entity" data-qualified-name="N1" data-source-line="63" id="ent0017"><path d="M69.67,274.0783 L69.67,360.631 A0,0 0 0 0 69.67,360.631 L209.54,360.631 L235.83,473.3283 L217.54,360.631 L340.5391,360.631 A0,0 0 0 0 340.5391,360.631 L340.5391,284.0783 L330.5391,274.0783 L69.67,274.0783 A0,0 0 0 0 69.67,274.0783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M330.5391,274.0783 L330.5391,284.0783 L340.5391,284.0783 L330.5391,274.0783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.3828" x="75.67" y="291.6466">La flecha de compilacion va en un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.2012" x="75.67" y="306.9572">solo sentido, hacia la interfaz:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.8691" x="75.67" y="322.2677">GestorReservas --&gt; ReservaRepository.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.3687" x="75.67" y="337.5783">No hay ninguna clase de bajo nivel</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.2236" x="75.67" y="352.8888">de la que dependa a su vez.</text></g><!--link GestorReservas to ReservaRepository--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005