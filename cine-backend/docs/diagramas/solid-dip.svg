z en el codigo fuente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3262" x="526.05" y="617.4877">Spring Data la genera al arrancar,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.2588" x="526.05" y="632.7983">a partir de la firma de cada metodo.</text></g><!--class Aplicacion--><g class="entity" data-qualified-name="Aplicacion" data-source-line="38" id="ent0009"><rect fill="#F1F1F1" height="40.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.2031" x="7" y="89.4183"/><ellipse cx="22" cy="109.7288" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M24.4731,115.8719 Q23.8921,116.1707 23.2529,116.3201 Q22.6138,116.4696 21.9082,116.4696 Q19.4014,116.4696 18.0815,114.8177 Q16.7617,113.1658 16.7617,110.0447 Q16.7617,106.9154 18.0815,105.2635 Q19.4014,103.6116 21.9082,103.6116 Q22.6138,103.6116 23.2612,103.7611 Q23.9087,103.9105 24.4731,104.2093 L24.4731,106.932 Q23.8423,106.3509 23.2488,106.0811 Q22.6553,105.8113 22.0244,105.8113 Q20.6797,105.8113 19.9949,106.878 Q19.3101,107.9446 19.3101,110.0447 Q19.3101,112.1365 19.9949,113.2032 Q20.6797,114.2698 22.0244,114.2698 Q22.6553,114.2698 23.2488,114.0001 Q23.8423,113.7303 24.4731,113.1492 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="152.2031" x="34" y="106.0198">&#171;@SpringBootApplication&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.9727" x="75.1152" y="122.0862">Aplicacion</text></g><g class="entity" data-qualified-name="N2" data-source-line="43" id="ent0011"><path d="M517.55,43.4883 L517.55,175.9727 A0,0 0 0 0 517.55,175.9727 L595.59,175.9727 L484.5,331.5783 L603.59,175.9727 L778.6438,175.9727 A0,0 0 0 0 778.6438,175.9727 L778.6438,53.4883 L768.6438,43.4883 L517.55,43.4883 A0,0 0 0 0 517.55,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M768.6438,43.4883 L768.6438,53.4883 L778.6438,53.4883 L768.6438,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.0938" x="523.55" y="61.0566">ArquitecturaTest ya no busca "un solo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.1577" x="523.55" y="76.3672">lugar nombra la implementacion" -no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.1431" x="523.55" y="91.6777">tendria que buscar-: verifica que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4688" x="523.55" y="106.9883">ningun service/ ni controller/</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.9282" x="523.55" y="122.2988">importe jakarta.persistence,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.3813" x="523.55" y="137.6094">java.sql u org.springframework.jdbc.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.0552" x="523.55" y="152.9199">Si alguien se saltea su repositorio,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.021" x="523.55" y="168.2305">el test lo detecta.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="55" id="ent0014"><path d="M221.71,66.4483 L221.71,105.7283 L187.25,109.7283 L221.71,113.7283 L221.71,153.001 A0,0 0 0 0 221.71,153.001 L482.4864,153.001 A0,0 0 0 0 482.4864,153.001 L482.4864,76.4483 L472.4864,66.4483 L221.71,66.4483 A0,0 0 0 0 221.71,66.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M472.4864,66.4483 L472.4864,76.4483 L482.4864,76.4483 L472.4864,66.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.7881" x="227.71" y="84.0166">Solo levanta el contenedor de Spring</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.9902" x="227.71" y="99.3272">(@SpringBootApplication + main()).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.7764" x="227.71" y="114.6377">No arma nada a mano: cada @Service,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.5386" x="227.71" y="129.9483">@Repository y @RestController se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7852" x="227.71" y="145.2588">conecta solo por component scan.</text></g><g class="entity" data-qualified-name="N1" data-source-line="65" id="ent0017"><path d="M78.67,281.7283 L78.67,414.2127 A0,0 0 0 0 78.67,414.2127 L221.95,414.2127 L246.17,526.7083 L229.95,414.2127 L349.5391,414.2127 A0,0 0 0 0 349.5391,414.2127 L349.5391,291.7283 L339.5391,281.7283 L78.67,281.7283 A0,0 0 0 0 78.67,281.7283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M339.5391,281.7283 L339.5391,291.7283 L349.5391,291.7283 L339.5391,281.7283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.3828" x="84.67" y="299.2966">La flecha de compilacion va en un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.2012" x="84.67" y="314.6072">solo sentido, hacia la interfaz:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.8691" x="84.67" y="329.9177">GestorReservas --&gt; ReservaRepository.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.2871" x="84.67" y="345.2283">No hay una segunda clase de bajo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2686" x="84.67" y="360.5388">nivel de la que dependa a su vez -eso</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.7588" x="84.67" y="375.8494">es lo que hace mas fuerte esta D que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.3872" x="84.67" y="391.1599">la version con DAO, donde si habia</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.1904" x="84.67" y="406.4705">una implementacion concreta detras.</text></g><!--link GestorReservas to ReservaRepository--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="40" id="lnk10"><path codeLine="40" d="M460.41,364.1483 C434.22,395.5083 375.7858,465.4512 327.7458,522.9512" fill="none" id="GestorReservas-to-ReservaRepository" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="324.54,526.7883,333.38,522.4462,327.7458,522.9512,327.2408,517.317,324.54,526.7883" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.8804" x="392.94" y="457.7766">depende de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.7114" x="398.0245" y="473.0872">la interfaz</text></g><!--link Aplicacion to GestorReservas--><g class="link" data-entity-1="ent0009" data-entity-2="ent0002" data-link-type="dependency" data-source-line="62" id="lnk16"><path codeLine="62" d="M126.88,130.4583 C147.99,144.0483 177.23,162.0983 204.1,175.9683 C274.16,212.1383 301.3,202.5383 367.1,245.9683 C404.86,270.8983 43