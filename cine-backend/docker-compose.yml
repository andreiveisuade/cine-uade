services:
  mysql:
    image: mysql:8.4
    container_name: apps-interactivas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appsinteractivas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Se ejecuta solo la primera vez, cuando el volumen esta vacio:
      # asi el que clona el repo levanta la base ya con las tablas.
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 5

  # Visualizador web de la base: http://localhost:8080
  adminer:
    image: adminer:5
    container_name: apps-interactivas-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
