services:
  - type: web
    name: cine-uade
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/generos
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: TMDB_TOKEN
        sync: false
      - key: DB_POOL
        value: "5"
      - key: CINE_URL_PUBLICA
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CINE_SWAGGER
        value: "false"
      - key: TZ
        value: America/Argentina/Buenos_Aires
