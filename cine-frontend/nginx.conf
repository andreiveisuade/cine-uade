# El único contenedor que publica puerto al host. Sirve los archivos estáticos y
# reenvía /api al backend por la red interna de Docker.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass sin URI ni barra final: nginx manda la ruta original completa, y las
    # del backend ya incluyen el prefijo /api.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # El ruteo del front es por hash (#/pelicula/3): el fragmento no viaja al servidor,
    # así que alcanza con servir los dos entry points y los estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # El mock y el código fuente no se cachean: cambian en cada build.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No anunciar la versión de nginx.
    server_tokens off;
}
