# El único contenedor que publica puerto al host. Sirve los archivos estáticos y
# reenvía /api al backend por la red interna de Docker.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pedir cartelera es lo único que puede tardar más de treinta segundos: el backend
    # despierta al importador, que sale a TMDB y carga película por película, y recién ahí
    # contesta. Con el timeout general esa respuesta se cortaría con un 504 justo cuando
    # el trabajo ya estaba hecho.
    #
    # Va en un `location =` exacto —match literal, sin la barra ni lo que siga— así el
    # resto de /api conserva sus treinta segundos, que es lo que protege al front de
    # quedarse colgado si el backend se traba. El bloque se repite entero porque nginx no
    # hereda proxy_pass ni los headers entre locations.
    #
    # 180s le da margen al techo del backend, que corta a los 120.
    location = /api/importaciones {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    # proxy_pass sin URI ni barra final: nginx manda la ruta original completa, y las
    # del backend ya incluyen el prefijo /api.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Swagger UI y el JSON de OpenAPI. Van aparte de /api porque springdoc los publica en
    # la raíz —/swagger-ui/... son los estáticos de la propia UI, /v3/api-docs es el
    # contrato— y sin este bloque caerían en el `try_files` de abajo, que devuelve 404
    # porque esos archivos no están en la imagen de nginx sino adentro del backend.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # El ruteo del front es por hash (#/pelicula/3): el fragmento no viaja al servidor,
    # así que alcanza con servir los dos entry points y los estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite pone el hash del contenido en el nombre: un cambio es otro archivo, así que se
    # cachean para siempre. Sin access_log para que los logs muestren páginas, no assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No anunciar la versión de nginx.
    server_tokens off;
}
