# El único contenedor que publica puerto al host. Sirve los archivos estáticos y
# reenvía /api al backend por la red interna de Docker.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Explícito aunque sea el default: un pedido de la API pesa unos pocos KB, y el número que
    # dispara el 413 de abajo queda a la vista.
    client_max_body_size 1m;

    # Lo que contesta nginx por su cuenta —un cuerpo demasiado grande, el backend caído o que no
    # contesta a tiempo— sale por defecto como una página HTML. Swing y la web muestran el
    # {"error": "..."} tal cual; sin él caen en un texto genérico por código, y un 413 decía
    # «El servidor respondió con un error (código 413)». Los 502 y 504 que manda el propio
    # backend pasan tal cual: sin proxy_intercept_errors, error_page atiende solo los de nginx.
    error_page 413 @demasiado_grande;
    error_page 502 @backend_caido;
    error_page 504 @backend_lento;

    # `types {}` vacío: el Content-Type sale siempre de default_type, aunque la ruta pedida
    # termine en una extensión que nginx conoce.
    location @demasiado_grande {
        types { }
        default_type application/json;
        return 413 '{"error": "El pedido es demasiado grande: el máximo es 1 MB"}';
    }

    location @backend_caido {
        types { }
        default_type application/json;
        return 502 '{"error": "El servidor no está disponible: volvé a intentarlo en un rato"}';
    }

    location @backend_lento {
        types { }
        default_type application/json;
        return 504 '{"error": "El servidor tardó demasiado en contestar: volvé a intentarlo en un rato"}';
    }

    # Pedir cartelera es lo único que puede tardar más de treinta segundos: el backend
    # despierta al importador, que sale a TMDB y carga película por película, y recién ahí
    # contesta. Con el timeout general esa respuesta se cortaría con un 504 justo cuando
    # el trabajo ya estaba hecho.
    #
    # Va en un `location =` exacto —match literal, sin la barra ni lo que siga— así el
    # resto de /api conserva sus treinta segundos, que es lo que protege al front de
    # quedarse colgado si el backend se traba. El bloque se repite entero porque nginx no
    # hereda proxy_pass ni los headers entre locations.
    #
    # 180s le da margen al techo del backend, que corta a los 120.
    location = /api/importaciones {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    # proxy_pass sin URI ni barra final: nginx manda la ruta original completa, y las
    # del backend ya incluyen el prefijo /api.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Swagger UI y el JSON de OpenAPI. Van aparte de /api porque springdoc los publica en
    # la raíz —/swagger-ui/... son los estáticos de la propia UI, /v3/api-docs es el
    # contrato— y sin este bloque caerían en el `try_files` de abajo, que devuelve 404
    # porque esos archivos no están en la imagen de nginx sino adentro del backend.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # El ruteo del front es por hash (#/pelicula/3): el fragmento no viaja al servidor,
    # así que alcanza con servir los dos entry points y los estáticos.
    # El HTML se revalida siempre: si el navegador reusa uno viejo, pide assets que ya no existen.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Vite pone el hash del contenido en el nombre: un cambio es otro archivo, así que se
    # cachean para siempre. Sin access_log para que los logs muestren páginas, no assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No anunciar la versión de nginx.
    server_tokens off;
}
