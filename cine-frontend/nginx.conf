# El único contenedor que publica puerto al host. Sirve los archivos estáticos y
# reenvía /api al backend por la red interna de Docker.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pedir cartelera es lo único que puede tardar más de treinta segundos: el backend
    # despierta al importador, que sale a TMDB y carga película por película, y recién ahí
    # contesta. Con el timeout general esa respuesta se cortaría con un 504 justo cuando
    # el trabajo ya estaba hecho.
    #
    # Va en un `location =` exacto —match literal, sin la barra ni lo que siga— así el
    # resto de /api conserva sus treinta segundos, que es lo que protege al front de
    # quedarse colgado si el backend se traba. El bloque se repite entero porque nginx no
    # hereda proxy_pass ni los headers entre locations.
    #
    # 180s le da margen al techo del backend, que corta a los 120.
    location = /api/importaciones {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    # proxy_pass sin URI ni barra final: nginx manda la ruta original completa, y las
    # del backend ya incluyen el prefijo /api.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # El ruteo del front es por hash (#/pelicula/3): el fragmento no viaja al servidor,
    # así que alcanza con servir los dos entry points y los estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # El mock y el código fuente no se cachean: cambian en cada build.
    #
    # Y no se logean. Abrir una pantalla del panel son quince GET a módulos, y en
    # `docker compose logs` eso corre hacia arriba lo único que sirve: qué páginas se
    # visitaron y qué falló. Un log que hay que filtrar para leerlo es un log que no se
    # lee. Los errores de estos archivos igual aparecen en error_log, que no se toca.
    location ~* \.(js|css|svg|png|jpg|jpeg|ico|woff2?)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No anunciar la versión de nginx.
    server_tokens off;
}
