<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cine UADE</title>
<meta name="description" content="Cine UADE: mirá la cartelera, elegí tus butacas, sumá combos y promos y reservá tu entrada online." />
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<!-- og:image relativa: los scrapers piden URL absoluta, hay que anteponer el dominio público al deployar. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Cine UADE" />
<meta property="og:title" content="Cine UADE" />
<meta property="og:description" content="Mirá la cartelera, elegí tus butacas, sumá combos y promos y reservá tu entrada online." />
<meta property="og:locale" content="es_AR" />
<meta property="og:image" content="/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Isotipo de Cine UADE y el texto CINE UADE, con UADE en ámbar" />
<meta name="twitter:card" content="summary_large_image" />
<script>
  // Antes del primer pintado, para que el modo oscuro no arranque con un fogonazo blanco.
  // Lee la misma clave que después usa Mantine.
  try {
    var tema = localStorage.getItem("cine-tema");
    var oscuro = tema === "dark" || (tema !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-mantine-color-scheme", oscuro ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/app/main.jsx"></script>
</body>
</html>
