<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cine UADE</title>
<script>
  // Antes del primer pintado, para que el modo oscuro no arranque con un fogonazo blanco.
  // Lee la misma clave que después usa Mantine.
  try {
    var tema = localStorage.getItem("cine-tema");
    var oscuro = tema === "dark" || (tema !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-mantine-color-scheme", oscuro ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/cliente/main.jsx"></script>
</body>
</html>
