4 Q863.588,206.166 864.273,207.233 Q864.958,208.299 866.302,208.299 Q866.933,208.299 867.527,208.03 Q868.12,207.76 868.751,207.179 Z " fill="#000"/><text x="886.778" y="209.049" fill="#000" font-size="14" textLength="112.943">GestorFunciones</text><line x1="805.44" y1="219.758" x2="1048.559" y2="219.758" style="stroke:#181818;stroke-width:0.5;"/><text x="810.44" y="237.293" fill="#000" font-size="14" textLength="233.119">+agendaDe(salaId): AgendaDeSala</text></g><!--class AgendaDeSala--><g class="entity" data-qualified-name="service.funciones.AgendaDeSala" id="ent0007" data-source-line="31"><rect x="1216.82" y="187.758" width="214.351" height="56.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="1271.367" cy="203.758" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M1273.841,209.901 Q1273.259,210.2 1272.62,210.35 Q1271.981,210.499 1271.276,210.499 Q1268.769,210.499 1267.449,208.847 Q1266.129,207.195 1266.129,204.074 Q1266.129,200.945 1267.449,199.293 Q1268.769,197.641 1271.276,197.641 Q1271.981,197.641 1272.629,197.791 Q1273.276,197.94 1273.841,198.239 L1273.841,200.961 Q1273.21,200.38 1272.616,200.111 Q1272.023,199.841 1271.392,199.841 Q1270.047,199.841 1269.362,200.907 Q1268.677,201.974 1268.677,204.074 Q1268.677,206.166 1269.362,207.233 Q1270.047,208.299 1271.392,208.299 Q1272.023,208.299 1272.616,208.03 Q1273.21,207.76 1273.841,207.179 Z " fill="#000"/><text x="1291.867" y="209.049" fill="#000" font-size="14" textLength="96.756">AgendaDeSala</text><line x1="1217.82" y1="219.758" x2="1430.171" y2="219.758" style="stroke:#181818;stroke-width:0.5;"/><text x="1222.82" y="237.293" fill="#000" font-size="14" textLength="202.351">+chocaEn(inicio, fin): boolean</text></g><!--class PlanificadorGrilla--><g class="entity" data-qualified-name="service.programaciones.PlanificadorGrilla" id="ent0009" data-source-line="37"><rect x="1250.4" y="470.418" width="147.206" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="1265.4" cy="486.418" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M1267.873,492.561 Q1267.292,492.86 1266.653,493.01 Q1266.014,493.159 1265.308,493.159 Q1262.801,493.159 1261.482,491.507 Q1260.162,489.855 1260.162,486.734 Q1260.162,483.605 1261.482,481.953 Q1262.801,480.301 1265.308,480.301 Q1266.014,480.301 1266.661,480.451 Q1267.309,480.6 1267.873,480.899 L1267.873,483.621 Q1267.242,483.04 1266.649,482.771 Q1266.055,482.501 1265.424,482.501 Q1264.08,482.501 1263.395,483.567 Q1262.71,484.634 1262.71,486.734 Q1262.71,488.826 1263.395,489.893 Q1264.08,490.959 1265.424,490.959 Q1266.055,490.959 1266.649,490.69 Q1267.242,490.42 1267.873,489.839 Z " fill="#000"/><text x="1279.4" y="491.709" fill="#000" font-size="14" textLength="115.206">PlanificadorGrilla</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="44"><path d="M1486.82,126.798 L1486.82,305.214 L1835.175,305.214 L1835.175,136.798 L1825.175,126.798 L1486.82,126.798" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1825.175,126.798 L1825.175,136.798 L1835.175,136.798 L1825.175,126.798" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1492.82" y="144.367" fill="#000" font-size="13" textLength="294.474">Que butacas estan tomadas es un hecho sobre</text><text x="1492.82" y="159.677" fill="#000" font-size="13" textLength="272.105">la FUNCION, no sobre la reserva ni sobre la</text><text x="1492.82" y="174.988" fill="#000" font-size="13" textLength="294.011">sala: una reserva vigente las toma, un bloqueo</text><text x="1492.82" y="190.298" fill="#000" font-size="13" textLength="284.946">de quien esta eligiendo tambien. No cabia en</text><text x="1492.82" y="205.609" fill="#000" font-size="13" textLength="293.731">Reserva -no sabe de otras reservas- ni en Sala</text><text x="1492.82" y="220.919" fill="#000" font-size="13" textLength="327.355">-no sabe de horarios-, y ponerla en GestorReservas</text><text x="1492.82" y="236.23" fill="#000" font-size="13" textLength="290.139">la hubiera dejado escondida ahi cuando la API</text><text x="1492.82" y="251.54" fill="#000" font-size="13" textLength="292.151">y la consola necesitan la misma pregunta para</text><text x="1492.82" y="266.851" fill="#000" font-size="13" textLength="280.966">dibujar el mapa antes de que exista ninguna</text><text x="1492.82" y="282.162" fill="#000" font-size="13" textLength="274.428">reserva. Es la unica definicion de "ocupado"</text><text x="1492.82" y="297.472" fill="#000" font-size="13" textLength="75.842">del sistema.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="58"><path d="M1870.52,126.798 L1870.52,305.214 L2197.483,305.214 L2197.483,136.798 L2187.483,126.798 L1870.52,126.798" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2187.483,126.798 L2187.483,136.798 L2197.483,136.798 L2187.483,126.798" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1876.52" y="144.367" fill="#000" font-size="13" textLength="264.805">El precio de lista de una butaca: funcion x</text><text x="1876.52" y="159.677" fill="#000" font-size="13" textLength="251.342">multiplicador de sala x multiplicador de</text><text x="1876.52" y="174.988" fill="#000" font-size="13" textLength="262.71">butaca x multiplicador de tarifa. No es un</text><text x="1876.52" y="190.298" fill="#000" font-size="13" textLength="271.623">metodo de Funcion, Sala ni Asiento porque</text><text x="1876.52" y="205.609" fill="#000" font-size="13" textLength="244.353">necesita a los tres juntos, y ponerlo en</text><text x="1876.52" y="220.919" fill="#000" font-size="13" textLength="257.321">cualquiera de ellos le daria a esa entidad</text><text x="1876.52" y="236.23" fill="#000" font-size="13" textLength="281.569">una responsabilidad sobre las otras dos. Los</text><text x="1876.52" y="251.54" fill="#000" font-size="13" textLength="305.963">descuentos por promocion no pasan por aca: un</text><text x="1876.52" y="266.851" fill="#000" font-size="13" textLength="291.535">2x1 no se puede expresar como factor de una</text><text x="1876.52" y="282.162" fill="#000" font-size="13" textLength="277.088">butaca sola, por eso esa cuenta vive en otro</text><text x="1876.52" y="297.472" fill="#000" font-size="13" textLength="164.106">lado (ver solid-ocp.puml).</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="72"><path d="M1486.87,397.208 L1486.87,575.624 A0,0 0 0 0 1486.87,575.624 L1817.121,575.624 A0,0 0 0 0 1817.121,575.624 L1817.121,407.208 L1807.121,397.208 L1547.7,397.208 L1357.87,244.718 L1539.7,397.208 L1486.87,397.208 A0,0 0 0 0 1486.87,397.208" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1807.121,397.208 L1807.121,407.208 L1817.121,407.208 L1807.121,397.208" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1492.87" y="414.777" fill="#000" font-size="13" textLength="280.217">Existe por costo, no por modelo. La regla de</text><text x="1492.87" y="430.087" fill="#000" font-size="13" textLength="303.329">R3 -que dos funciones de una sala no se pisen-</text><text x="1492.87" y="445.398" fill="#000" font-size="13" textLength="299.635">ya la resuelve GestorFunciones.superpuestaEn()</text><text x="1492.87" y="460.708" fill="#000" font-size="13" textLength="285.448">para una consulta suelta, pero el planificador</text><text x="1492.87" y="476.019" fill="#000" font-size="13" textLength="300.441">prueba cientos de horarios por corrida y repetir</text><text x="1492.87" y="491.329" fill="#000" font-size="13" textLength="273.521">esas lecturas contra MySQL en cada intento</text><text x="1492.87" y="506.64" fill="#000" font-size="13" textLength="299.616">llevaba una propuesta de una semana a mas de</text><text x="1492.87" y="521.95" fill="#000" font-size="13" textLength="297.915">veinte segundos. AgendaDeSala no reescribe la</text><text x="1492.87" y="537.261" fill="#000" font-size="13" textLength="309.251">regla: guarda los tramos que GestorFunciones ya</text><text x="1492.87" y="552.572" fill="#000" font-size="13" textLength="296.613">calculo y solo compara numeros. Si R3 cambia,</text><text x="1492.87" y="567.882" fill="#000" font-size="13" textLength="155.892">cambia en un solo lugar.</text></g><g class="entity" data-qualified-name="N1" id="ent0022" data-source-line="86"><path d="M2232.67,165.068 L2232.67,266.932 L2523.337,266.932 L2523.337,175.068 L2513.337,165.068 L2232.67,165.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2513.337,165.068 L2513.337,175.068 L2523.337,175.068 L2513.337,165.068" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="2238.67" y="182.637" fill="#000" font-size="13" textLength="269.667">Las tres son fabricacion pura por el mismo</text><text x="2238.67" y="197.947" fill="#000" font-size="13" textLength="257.023">motivo: existen para que otra clase -una</text><text x="2238.67" y="213.258" fill="#000" font-size="13" textLength="252.707">entidad o un gestor- no cargue con una</text><text x="2238.67" y="228.568" fill="#000" font-size="13" textLength="268.1">responsabilidad que no es la suya, sin que</text><text x="2238.67" y="243.879" fill="#000" font-size="13" textLength="269.306">esa responsabilidad deje de tener un lugar</text><text x="2238.67" y="259.189" fill="#000" font-size="13" textLength="188.589">donde vivir bien cohesionada.</text></g><!--link GestorFunciones to AgendaDeSala--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk10" data-source-line="40" data-link-type="dependency"><path d="M1049.89,216.008 C1103.18,216.008 1160.02,216.008 1211.45,216.008" style="stroke:#181818;stroke-width:1;" fill="none" id="GestorFunciones-to-AgendaDeSala" codeLine="40"/><polygon points="1216.45,216.008,1207.45,212.008,1211.45,216.008,1207.45,220.008,1216.45,216.008" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1097.911" y="194.577" fill="#000" font-size="13" textLength="71.392">agendaDe()</text><text x="1067.69" y="209.887" fill="#000" font-size="13" textLength="131.834">construye y devuelve</text></g><!--reverse link AgendaDeSala to PlanificadorGrilla--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" id="lnk12" data-source-line="41" data-link-type="dependency"><path d="M1324,249.718 C1324,305.838 1324,426.308 1324,470.038" style="stroke:#181818;stroke-width:1;" fill="none" id="AgendaDeSala-backto-PlanificadorGrilla" codeLine="41"/><polygon points="1324,244.718,1320,253.718,1324,249.718,1328,253.718,1324,244.718" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1328.631" y="348.777" fill="#000" font-size="13" textLength="117.197">chocaEn(), una vez</text><text x="1325" y="364.087" fill="#000" font-size="13" textLength="124.458">por sala por corrida</text></g><!--link Ocupacion to GMN13--><g class="link" data-entity-1="ent0002" data-entity-2="ent0014" id="lnk15" data-source-line="44" data-link-type="association"><path d="M288.79,162.658 C330.69,126.478 391.49,81.778 454.5,62.028 C506.19,45.828 1377.65,46.358 1429.5,62.028 C1473.86,75.428 1517.5,100.438 1554.73,126.458" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Ocupacion-GMN13"/></g><!--link CalculadoraPrecio to GMN16--><g class="link" data-entity-1="ent0004" data-entity-2="ent0017" id="lnk18" data-source-line="58" data-link-type="association"><path d="M643.11,171.018 C681.35,133.718 741.43,83.448 805.5,62.028 C859.77,43.878 1781.36,43.488 1835.5,62.028 C1875.11,75.588 1912.93,100.638 1944.73,126.638" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="CalculadoraPrecio-GMN16"/></g><?plantuml-src TLTDRniv3BtxLn2vR8BQndRtPXG5qcvI1CYcsRe5UkY5df77QZNIhAGnuXRvx_j8pRZ-w9uodY4fyl7nYSasEqFlFbml7nTqowjeAwviyDJraMb6bUDa4ltR6pAEsb0R5wWpjMLArbCoaOpFj