<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:2538px;height:590px;background:#FFFFFF;" width="2538px" height="590px" viewBox="0 0 2538 590" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="980.624" y="23.535" fill="#000" font-size="14" textLength="570.09" font-weight="700">GRASP: Fabricacion pura - clases que el modelo pedia sin ser entidad ni gestor</text></g><!--cluster service--><g class="cluster" data-qualified-name="service" id="ent0003" data-source-line="15"><rect x="7" y="85.028" width="1464" height="457.39" fill="none" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="713.502" y="100.563" fill="#000" font-size="14" textLength="50.996" font-weight="700">service</text></g><!--cluster ventas--><g class="cluster" data-qualified-name="service.ventas" id="ent0001" data-source-line="14"><rect x="31" y="128.028" width="733" height="156.95" fill="none" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="373.738" y="143.563" fill="#000" font-size="14" textLength="47.523" font-weight="700">ventas</text></g><!--cluster funciones--><g class="cluster" data-qualified-name="service.funciones" id="ent0005" data-source-line="27"><rect x="788" y="152.758" width="659" height="107.49" fill="none" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="1082.274" y="168.293" fill="#000" font-size="14" textLength="70.451" font-weight="700">funciones</text></g><!--cluster programaciones--><g class="cluster" data-qualified-name="service.programaciones" id="ent0008" data-source-line="36"><rect x="1234" y="435.418" width="180" height="83" fill="none" style="stroke:#000;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="1265.761" y="450.953" fill="#000" font-size="14" textLength="116.478" font-weight="700">progra