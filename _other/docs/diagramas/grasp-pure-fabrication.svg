rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M537.697,192.621 Q537.116,192.92 536.477,193.07 Q535.838,193.219 535.132,193.219 Q532.625,193.219 531.305,191.567 Q529.986,189.915 529.986,186.794 Q529.986,183.665 531.305,182.013 Q532.625,180.361 535.132,180.361 Q535.838,180.361 536.485,180.511 Q537.133,180.66 537.697,180.959 L537.697,183.681 Q537.066,183.1 536.473,182.831 Q535.879,182.561 535.248,182.561 Q533.904,182.561 533.219,183.627 Q532.534,184.694 532.534,186.794 Q532.534,188.886 533.219,189.953 Q533.904,191.019 535.248,191.019 Q535.879,191.019 536.473,190.75 Q537.066,190.48 537.697,189.899 Z " fill="#000"/><text x="555.724" y="191.769" fill="#000" font-size="14" textLength="121.058">CalculadoraPrecio</text><line x1="455.03" y1="202.478" x2="744.975" y2="202.478" style="stroke:#181818;stroke-width:0.5;"/><text x="460.03" y="220.013" fill="#000" font-size="14" textLength="229.879">+precioDe(Funcion, Sala, Asiento,</text><text x="460.03" y="236.502" fill="#000" font-size="14" textLength="128.311">TipoTarifa): Dinero</text><text x="460.03" y="252.99" fill="#000" font-size="14" textLength="279.945">+precioBaseEnSala(Funcion, Sala): Dinero</text></g><!--class GestorFunciones--><g class="entity" data-qualified-name="service.funciones.GestorFunciones" id="ent0006" data-source-line="28"><rect x="802.14" y="186.968" width="339.722" height="56.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="911.279" cy="202.968" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M913.752,209.111 Q913.171,209.41 912.532,209.56 Q911.893,209.709 911.187,209.709 Q908.681,209.709 907.361,208.057 Q906.041,206.405 906.041,203.284 Q906.041,200.155 907.361,198.503 Q908.681,196.851 911.187,196.851 Q911.893,196.851 912.54,197.001 Q913.188,197.15 913.752,197.449 L913.752,200.171 Q913.121,199.59 912.528,199.321 Q911.934,199.051 911.304,199.051 Q909.959,199.051 909.274,200.117 Q908.589,201.184 908.589,203.284 Q908.589,205.376 909.274,206.443 Q909.959,207.509 911.304,207.509 Q911.934,207.509 912.528,207.24 Q913.121,206.97 913.752,206.389 Z " fill="#000"/><text x="931.779" y="208.259" fill="#000" font-size="14" textLength="112.943">GestorFunciones</text><line x1="803.14" y1="218.968" x2="1140.862" y2="218.968" style="stroke:#181818;stroke-width:0.5;"/><text x="808.14" y="236.503" fill="#000" font-size="14" textLength="327.722">+agendaDe(salaId, desde, hasta): AgendaDeSala</text></g><!--class AgendaDeSala--><g class="entity" data-qualified-name="service.funciones.AgendaDeSala" id="ent0007" data-source-line="31"><rect x="1309.82" y="186.968" width="214.351" height="56.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="1364.367" cy="202.968" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M1366.841,209.111 Q1366.259,209.41 1365.62,209.56 Q1364.981,209.709 1364.276,209.709 Q1361.769,209.709 1360.449,208.057 Q1359.129,206.405 1359.129,203.284 Q1359.129,200.155 1360.449,198.503 Q1361.769,196.851 1364.276,196.851 Q1364.981,196.851 1365.629,197.001 Q1366.276,197.15 1366.841,197.449 L1366.841,200.171 Q1366.21,199.59 1365.616,199.321 Q1365.023,199.051 1364.392,199.051 Q1363.047,199.051 1362.362,200.117 Q1361.677,201.184 1361.677,203.284 Q1361.677,205.376 1362.362,206.443 Q1363.047,207.509 1364.392,207.509 Q1365.023,207.509 1365.616,207.24 Q1366.21,206.97 1366.841,206.389 Z " fill="#000"/><text x="1384.867" y="208.259" fill="#000" font-size="14" textLength="96.756">AgendaDeSala</text><line x1="1310.82" y1="218.968" x2="1523.171" y2="218.968" style="stroke:#181818;stroke-width:0.5;"/><text x="1315.82" y="236.503" fill="#000" font-size="14" textLength="202.351">+chocaEn(inicio, fin): boolean</text></g><!--class PlanificadorGrilla--><g class="entity" data-qualified-name="service.programaciones.PlanificadorGrilla" id="ent0009" data-source-line="37"><rect x="1343.4" y="469.628" width="147.206" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="1358.4" cy="485.628" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M1360.873,491.771 Q1360.292,492.07 1359.653,492.22 Q1359.014,492.369 1358.308,492.369 Q1355.801,492.369 1354.482,490.717 Q1353.162,489.065 1353.162,485.944 Q1353.162,482.815 1354.482,481.163 Q1355.801,479.511 1358.308,479.511 Q1359.014,479.511 1359.661,479.661 Q1360.309,479.81 1360.873,480.109 L1360.873,482.831 Q1360.242,482.25 1359.649,481.981 Q1359.055,481.711 1358.424,481.711 Q1357.08,481.711 1356.395,482.777 Q1355.71,483.844 1355.71,485.944 Q1355.71,488.036 1356.395,489.103 Q1357.08,490.169 1358.424,490.169 Q1359.055,490.169 1359.649,489.9 Q1360.242,489.63 1360.873,489.049 Z " fill="#000"/><text x="1372.4" y="490.919" fill="#000" font-size="14" textLength="115.206">PlanificadorGrilla</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="44"><path d="M1579.82,126.008 L1579.82,304.424 L1928.175,304.424 L1928.175,136.008 L1918.175,126.008 L1579.82,126.008" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1918.175,126.008 L1918.175,136.008 L1928.175,136.008 L1918.175,126.008" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1585.82" y="143.577" fill="#000" font-size="13" textLength="294.474">Que butacas estan tomadas es un hecho sobre</text><text x="1585.82" y="158.887" fill="#000" font-size="13" textLength="272.105">la FUNCION, no sobre la reserva ni sobre la</text><text x="1585.82" y="174.198" fill="#000" font-size="13" textLength="294.011">sala: una reserva vigente las toma, un bloqueo</text><text x="1585.82" y="189.508" fill="#000" font-size="13" textLength="284.946">de quien esta eligiendo tambien. No cabia en</text><text x="1585.82" y="204.819" fill="#000" font-size="13" textLength="293.731">Reserva -no sabe de otras reservas- ni en Sala</text><text x="1585.82" y="220.129" fill="#000" font-size="13" textLength="327.355">-no sabe de horarios-, y ponerla en GestorReservas</text><text x="1585.82" y="235.44" fill="#000" font-size="13" textLength="290.139">la hubiera dejado escondida ahi cuando la API</text><text x="1585.82" y="250.75" fill="#000" font-size="13" textLength="205.753">necesita la misma pregunta para</text><text x="1585.82" y="266.061" fill="#000" font-size="13" textLength="280.966">dibujar el mapa antes de que exista ninguna</text><text x="1585.82" y="281.372" fill="#000" font-size="13" textLength="274.428">reserva. Es la unica definicion de "ocupado"</text><text x="1585.82" y="296.682" fill="#000" font-size="13" textLength="75.842">del sistema.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="58"><path d="M1963.52,126.008 L1963.52,304.424 L2290.483,304.424 L2290.483,136.008 L2280.483,126.008 L1963.52,126.008" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2280.483,126.008 L2280.483,136.008 L2290.483,136.008 L2280.483,126.008" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1969.52" y="143.577" fill="#000" font-size="13" textLength="264.805">El precio de lista de una butaca: funcion x</text><text x="1969.52" y="158.887" fill="#000" font-size="13" textLength="251.342">multiplicador de sala x multiplicador de</text><text x="1969.52" y="174.198" fill="#000" font-size="13" textLength="262.71">butaca x multiplicador de tarifa. No es un</text><text x="1969.52" y="189.508" fill="#000" font-size="13" textLength="271.623">metodo de Funcion, Sala ni Asiento porque</text><text x="1969.52" y="204.819" fill="#000" font-size="13" textLength="244.353">necesita a los tres juntos, y ponerlo en</text><text x="1969.52" y="220.129" fill="#000" font-size="13" textLength="257.321">cualquiera de ellos le daria a esa entidad</text><text x="1969.52" y="235.44" fill="#000" font-size="13" textLength="281.569">una responsabilidad sobre las otras dos. Los</text><text x="1969.52" y="250.75" fill="#000" font-size="13" textLength="305.963">descuentos por promocion no pasan por aca: un</text><text x="1969.52" y="266.061" fill="#000" font-size="13" textLength="291.535">2x1 no se puede expresar como factor de una</text><text x="1969.52" y="281.372" fill="#000" font-size="13" textLength="277.088">butaca sola, por eso esa cuenta vive en otro</text><text x="1969.52" y="296.682" fill="#000" font-size="13" textLength="164.106">lado (ver solid-ocp.puml).</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="72"><path d="M1579.87,396.418 L1579.87,574.834 A0,0 0 0 0 1579.87,574.834 L1910.121,574.834 A0,0 0 0 0 1910.121,574.834 L1910.121,406.418 L1900.121,396.418 L1640.7,396.418 L1450.87,243.928 L1632.7,396.418 L1579.87,396.418 A0,0 0 0 0 1579.87,396.418" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1900.121,396.418 L1900.121,406.418 L1910.121,406.418 L1900.121,396.418" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1585.87" y="413.987" fill="#000" font-size="13" textLength="280.217">Existe por costo, no por modelo. La regla de</text><text x="1585.87" y="429.297" fill="#000" font-size="13" textLength="303.329">R3 -que dos funciones de una sala no se pisen-</text><text x="1585.87" y="444.608" fill="#000" font-size="13" textLength="299.635">ya la resuelve GestorFunciones.superpuestaEn()</text><text x="1585.87" y="459.918" fill="#000" font-size="13" textLength="285.448">para una consulta suelta, pero el planificador</text><text x="1585.87" y="475.229" fill="#000" font-size="13" textLength="300.441">prueba cientos de horarios por corrida y repetir</text><text x="1585.87" y="490.539" fill="#000" font-size="13" textLength="273.521">esas lecturas contra MySQL en cada intento</text><text x="1585.87" y="505.85" fill="#000" font-size="13" textLength="299.616">llevaba una propuesta de una semana a mas de</text><text x="1585.87" y="521.16" fill="#000" font-size="13" textLength="297.915">veinte segundos. AgendaDeSala no reescribe la</text><text x="1585.87" y="536.471" fill="#000" font-size="13" textLength="309.251">regla: guarda los tramos que GestorFunciones ya</text><text x="1585.87" y="551.782" fill="#000" font-size="13" textLength="296.613">calculo y solo compara numeros. Si R3 cambia,</text><text x="1585.87" y="567.092" fill="#000" font-size="13" textLength="155.892">cambia en un solo lugar.</text></g><g class="entity" data-qualified-name="N1" id="ent0022" data-source-line="86"><path d="M2325.67,164.278 L2325.67,266.142 L2616.337,266.142 L2616.337,174.278 L2606.337,164.278 L2325.67,164.278" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2606.337,164.278 L2606.337,174.278 L2616.337,174.278 L2606.337,164.278" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="2331.67" y="181.847" fill="#000" font-size="13" textLength="269.667">Las tres son fabricacion pura por el mismo</text><text x="2331.67" y="197.157" fill="#000" font-size="13" textLength="257.023">motivo: existen para que otra clase -una</text><text x="2331.67" y="212.468" fill="#000" font-size="13" textLength="252.707">entidad o un gestor- no cargue con una</text><text x="2331.67" y="227.778" fill="#000" font-size="13" textLength="268.1">responsabilidad que no es la suya, sin que</text><text x="2331.67" y="243.089" fill="#000" font-size="13" textLength="269.306">esa responsabilidad deje de tener un lugar</text><text x="2331.67" y="258.399" fill="#000" font-size="13" textLength="188.589">donde vivir bien cohesionada.</text></g><!--link GestorFunciones to AgendaDeSala--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk10" data-source-line="40" data-link-type="dependency"><path d="M1142.14,215.218 C1198.33,215.218 1254.24,215.218 1304.41,215.218" style="stroke:#181818;stroke-width:1;" fill="none" id="GestorFunciones-to-AgendaDeSala" codeLine="40"/><polygon points="1309.41,215.218,1300.41,211.218,1304.41,215.218,1300.41,219.218,1309.41,215.218" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1190.561" y="193.787" fill="#000" font-size="13" textLength="71.392">agendaDe()</text><text x="1160.34" y="209.097" fill="#000" font-size="13" textLength="131.834">construye y devuelve</text></g><!--reverse link AgendaDeSala to PlanificadorGrilla--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" id="lnk12" data-source-line="41" data-link-type="dependency"><path d="M1417,248.928 C1417,305.048 1417,425.518 1417,469.248" style="stroke:#181818;stroke-width:1;" fill="none" id="AgendaDeSala-backto-PlanificadorGrilla" codeLine="41"/><polygon points="1417,243.928,1413,252.928,1417,248.928,1421,252.928,1417,243.928" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1421.631" y="347.987" fill="#000" font-size="13" textLength="117.197">chocaEn(), una vez</text><text x="1418" y="363.297" fill="#000" font-size="13" textLength="124.458">por sala por corrida</text></g><!--link Ocupacion to GMN13--><g class="link" data-entity-1="ent0002" data-entity-2="ent0014" id="lnk15" data-source-line="44" data-link-type="association"><path d="M288.79,161.868 C330.69,125.688 391.49,80.988 454.5,61.238 C511.12,43.488 1465.7,44.078 1522.5,61.238 C1566.86,74.638 1610.5,99.648 1647.73,125.668" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Ocupacion-GMN13"/></g><!--link CalculadoraPrecio to GMN16--><g class="link" data-entity-1="ent0004" data-entity-2="ent0017" id="lnk18" data-source-line="58" data-link-type="association"><path d="M641.86,170.238 C679.89,132.928 739.66,82.668 803.5,61.238 C833.13,51.288 1898.93,51.118 1928.5,61.238 C1968.11,74.798 2005.93,99.848 2037.73,125.848" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="CalculadoraPrecio-GMN16"/></g><?plantuml-src TLTDRnD94BtxLvHosKJOrh9xYn1IW0H5oeQ0GUB0fJpJ7ZVqTCzszrWnAFzzNrNFEFvWR_5qVTUhLvLiipFq_jFLuk6IRdWPRSML3PwwFZBDg7ASJA9_UqF6KHjgum9rfhPCoNf