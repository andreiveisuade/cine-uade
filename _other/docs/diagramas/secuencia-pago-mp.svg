        <title id="secuencia-pago-mp-title">Comprar y pagar con Mercado Pago</title>
        <desc id="secuencia-pago-mp-desc">La reserva se crea en MySQL, el backend arma la preferencia en Mercado Pago y el pago se cobra cuando el comprador vuelve o, si no vuelve, en la conciliación de cada 60 segundos.</desc>
