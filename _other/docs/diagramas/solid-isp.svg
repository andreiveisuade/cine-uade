 x1="523.69" y1="465.868" x2="773.447" y2="465.868" style="stroke:#181818;stroke-width:0.5;"/><text x="528.69" y="483.403" fill="#000" font-size="14" textLength="138.435">+crearPorcentaje(...)</text><text x="528.69" y="499.892" fill="#000" font-size="14" textLength="135.276">+crearMontoFijo(...)</text><text x="528.69" y="516.38" fill="#000" font-size="14" textLength="98.67">+crearNxM(...)</text><text x="528.69" y="532.868" fill="#000" font-size="14" textLength="77.984">+activar(id)</text><text x="528.69" y="549.357" fill="#000" font-size="14" textLength="101.732">+desactivar(id)</text><text x="528.69" y="565.845" fill="#000" font-size="14" textLength="181.405">+listar(): List&lt;Promocion></text><text x="528.69" y="582.333" fill="#000" font-size="14" textLength="239.757">+buscar(id): Optional&lt;Promocion></text><line x1="523.69" y1="589.286" x2="773.447" y2="589.286" style="stroke:#181818;stroke-width:1;"/><text x="528.69" y="606.821" fill="#000" font-size="14" textLength="195.234">+calcularPara(...): Descuento</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="45"><path d="M830.76,255.318 L830.76,341.871 L1144.374,341.871 L1144.374,265.318 L1134.374,255.318 L830.76,255.318" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1134.374,255.318 L1134.374,265.318 L1144.374,265.318 L1134.374,255.318" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="836.76" y="272.887" fill="#000" font-size="13" textLength="269.871">cobrar() le pregunta a la interfaz un monto</text><text x="836.76" y="288.197" fill="#000" font-size="13" textLength="287.6">y de que promocion salio, nada mas. No sabe</text><text x="836.76" y="303.508" fill="#000" font-size="13" textLength="292.614">que existe un ABM de promociones ni que hay</text><text x="836.76" y="318.818" fill="#000" font-size="13" textLength="281.214">una regla para elegir "la que mas descuenta"</text><text x="836.76" y="334.129" fill="#000" font-size="13" textLength="260.99">(R15): eso vive del otro lado del contrato.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="53"><path d="M493.4,700.778 L493.4,802.642 A0,0 0 0 0 493.4,802.642 L803.733,802.642 A0,0 0 0 0 803.733,802.642 L803.733,710.778 L793.733,700.778 L652.57,700.778 L648.57,614.098 L644.57,700.778 L493.4,700.778 A0,0 0 0 0 493.4,700.778" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M793.733,700.778 L793.733,710.778 L803.733,710.778 L793.733,700.778" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="499.4" y="718.347" fill="#000" font-size="13" textLength="276.961">Implementa PoliticaPromociones ademas de</text><text x="499.4" y="733.657" fill="#000" font-size="13" textLength="281.265">tener el ABM completo: es una interfaz chica</text><text x="499.4" y="748.968" fill="#000" font-size="13" textLength="274.409">sobre una clase grande, no una clase chica.</text><text x="499.4" y="764.278" fill="#000" font-size="13" textLength="289.333">ISP no dice que GestorPromociones tenga que</text><text x="499.4" y="779.589" fill="#000" font-size="13" textLength="247.4">achicarse; dice que nadie deberia verse</text><text x="499.4" y="794.899" fill="#000" font-size="13" textLength="272.898">obligado a depender de mas de lo que usa.</text></g><g class="entity" data-qualified-name="N1" id="ent0018" data-source-line="62"><path d="M6,43.488 L6,145.352 A0,0 0 0 0 6,145.352 L169.57,145.352 L173.57,282.268 L177.57,145.352 L341.133,145.352 A0,0 0 0 0 341.133,145.352 L341.133,53.488 L331.133,43.488 L6,43.488 A0,0 0 0 0 6,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M331.133,43.488 L331.133,53.488 L341.133,53.488 L331.133,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="61.057" fill="#000" font-size="13" textLength="314.133">Si GestorPagos dependiera de GestorPromociones</text><text x="12" y="76.367" fill="#000" font-size="13" textLength="295.083">a secas, cualquier cambio en el ABM -otro tipo</text><text x="12" y="91.678" fill="#000" font-size="13" textLength="283.067">de promocion, otro parametro en crearNxM-</text><text x="12" y="106.988" fill="#000" font-size="13" textLength="248.523">obligaria a recompilar y volver a probar</text><text x="12" y="122.299" fill="#000" font-size="13" textLength="264.786">GestorPagos, que no toca esas lineas ni le</text><text x="12" y="137.609" fill="#000" font-size="13" textLength="61.604">importan.</text></g><!--link GestorPagos to PoliticaPromociones--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk8" data-source-line="39" data-link-type="dependency"><path d="M232.16,298.588 C269.59,298.588 315.55,298.588 366.68,298.588" style="stroke:#181818;stroke-width:1;" fill="none" id="GestorPagos-to-PoliticaPromociones" codeLine="39"/><polygon points="371.68,298.588,362.68,294.588,366.68,298.588,362.68,302.588,371.68,298.588" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="249.99" y="292.157" fill="#000" font-size="13" textLength="104.711">depende de esto</text></g><!--reverse link PoliticaPromociones to GestorPromociones--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk10" data-source-line="40" data-link-type="extension"><path d="M588.495,344.03 C597.415,370.57 605.71,395.248 618.52,433.388" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="PoliticaPromociones-backto-GestorPromociones" codeLine="40"/><polygon points="582.76,326.968,582.807,345.942,594.182,342.119,582.76,326.968" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="607.58" y="385.437" fill="#000" font-size="13" textLength="109.51">implementa esto,</text><text x="614.753" y="400.747" fill="#000" font-size="13" textLength="95.164">y bastante mas</text></g><!--link PoliticaPromociones to Descuento--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-source-line="42" data-link-type="dependency"><path d="M552.6,326.968 C519.87,369.688 460.011,447.829 427.011,490.909" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="PoliticaPromociones-to-Descuento" codeLine="42"/><polygon points="423.97,494.878,432.618,490.166,427.011,490.909,426.268,485.301,423.97,494.878" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GestorPagos to GMN12--><g class="link" data-entity-1="ent0002" data-entity-2="ent0013" id="lnk14" data-source-line="45" data-link-type="association"><path d="M184.69,282.188 C206.23,252.048 256.96,188.788 318.07,164.848 C365.14,146.408 724.46,150.938 773.07,164.848 C834.24,182.358 894.93,222.938 936.06,254.838" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="GestorPagos-GMN12"/></g><?plantuml-src TLLDRzj64BthLmnqgOnAH7teHJKCk0rI6B0TeRhcCYGdz2RBNMPtAKHfyz_xPabJbArSR6hd-ysRcMII5Tf_UBX_jwMzD44QhentL0iPboHyuaeYRQZoPU10pfCJl9Z499Rk_dnKpIxurgkPnCKYVZ6kuy0jLPPZl4ifcB9FSbzvjpVVXNwRgNHSVU56zkc8D89KYLrZPV5iu5NQBXsfbRQK0B-_q1qIYXhlQm_fDnEJaS2qyzOaK_7kbCMQ_fQOVDXnuzMY4rSRnWUyZ9AJCZ55gJXkoJBr3fvoveAQNHKagPsADAfFmLEJFS3Lv5WS9LzxXIGYBMcveBy6nAAtCynwHwvl9VWrTVXBR2St4iOuGt1Hz7FGcaicJWp_YTlI81YKWd3O-L11Zp_B6cxoqwDtoRytdn4W_txwzhWchf8vS5WZG9o-BHBL_sKVAmv5KG1gBIB2bPRgUWSaZCOcQxb5BSSiC4tFbb2LBwrfa9pcWzxvjZDMApPKQPugAU3iWL-ez5qh10GPao4Q0N-WLlcGP7lMjKC6eqE9oaS4Xgi-ybevQ4yjQZkB5XMBnKWbMaO91rD9SL1eufB-NT10nRdxnOyB5ZCU3sRJ25mYMTOW-hLYM_KeV0T6hn0pSCrWe06JZ7yF5A6zHhcryLTRUYUnwg7bOVnZocmvFNzqKnRtDSoqdqlYU3Aacnj5EzItjulNfLt8xfmeApJwQYQP-F9Q0EBCdaRMh4mzFfoOT7eR6BL2aG_ukfcIkHt40z5KVKiVkWG1szTAcyq5J3MDry2XVNEoR89fdjFczcAVjYyJflHJeyLRj8g-A_xxcRbHahKAO3PVVtH7AXd5WXxKCfRJ9RkYk9qblN0UoZbDyf_Eg4ZZTbrTaTLbAasleLXfFaqEnYPp0Th7bnquCOKYMuEHTw2U9bJGayTRAT2UbcKUlRSRcvp9EizyX7RlT9ORdJn0Zz6KnWHQZkiFhdM7v99u2VNLFzU_epSIFHtCGG6smuwqkgxgFDaw4SaN2tI058GHYjAdvDiP5hCZGdH_WlmIjbpBa0jKapZipl4QZGl1Qqwvc0d0wXa-e1w1jMJHi4AQmA1