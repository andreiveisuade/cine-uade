t><text x="387.63" y="630.832" fill="#000" font-size="14" textLength="67.936">-paga: int</text><line x1="382.63" y1="637.785" x2="651.268" y2="637.785" style="stroke:#181818;stroke-width:0.5;"/><text x="387.63" y="655.32" fill="#000" font-size="14" textLength="258.638">+calcularDescuento(entradas): double</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="49"><path d="M1319.63,379.978 L1319.63,434.568 L1115.32,438.568 L1319.63,442.568 L1319.63,497.152 A0,0 0 0 0 1319.63,497.152 L1640.277,497.152 A0,0 0 0 0 1640.277,497.152 L1640.277,389.978 L1630.277,379.978 L1319.63,379.978 A0,0 0 0 0 1319.63,379.978" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1630.277,379.978 L1630.277,389.978 L1640.277,389.978 L1630.277,379.978" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1325.63" y="397.547" fill="#000" font-size="13" textLength="291.478">aplicaA() esta ESCRITA UNA VEZ ACA y las tres</text><text x="1325.63" y="412.857" fill="#000" font-size="13" textLength="276.282">hijas la heredan sin tocarla: vigencia, dia de</text><text x="1325.63" y="428.168" fill="#000" font-size="13" textLength="282.02">semana, horario y medio de pago se evaluan</text><text x="1325.63" y="443.478" fill="#000" font-size="13" textLength="277.272">igual sea cual sea el beneficio. Lo unico que</text><text x="1325.63" y="458.789" fill="#000" font-size="13" textLength="299.647">cada clase decide distinto es cuanto descuenta,</text><text x="1325.63" y="474.099" fill="#000" font-size="13" textLength="276.047">y eso es abstracto: obliga a que cada hija lo</text><text x="1325.63" y="489.41" fill="#000" font-size="13" textLength="137.617">resuelva a su manera.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="59"><path d="M1057.78,737.588 L1057.78,778.209 A0,0 0 0 0 1057.78,778.209 L1200.122,778.209 A0,0 0 0 0 1200.122,778.209 L1200.122,747.588 L1190.122,737.588 L1132.95,737.588 L1128.95,654.198 L1124.95,737.588 L1057.78,737.588 A0,0 0 0 0 1057.78,737.588" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1190.122,737.588 L1190.122,747.588 L1200.122,747.588 L1190.122,737.588" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1063.78" y="755.157" fill="#000" font-size="13" textLength="91.736">% del subtotal:</text><text x="1063.78" y="770.467" fill="#000" font-size="13" textLength="121.342">"miercoles 30% off"</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="63"><path d="M731.75,722.278 L731.75,793.52 A0,0 0 0 0 731.75,793.52 L914.146,793.52 A0,0 0 0 0 914.146,793.52 L914.146,732.278 L904.146,722.278 L826.95,722.278 L822.95,654.198 L818.95,722.278 L731.75,722.278 A0,0 0 0 0 731.75,722.278" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M904.146,722.278 L904.146,732.278 L914.146,732.278 L904.146,722.278" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="737.75" y="739.847" fill="#000" font-size="13" textLength="139.585">Monto fijo, topeado al</text><text x="737.75" y="755.157" fill="#000" font-size="13" textLength="128.458">subtotal para no dar</text><text x="737.75" y="770.468" fill="#000" font-size="13" textLength="118.536">un cobro negativo:</text><text x="737.75" y="785.778" fill="#000" font-size="13" textLength="161.396">"$2000 off con tal banco"</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="69"><path d="M430.36,722.278 L430.36,793.52 A0,0 0 0 0 430.36,793.52 L603.551,793.52 A0,0 0 0 0 603.551,793.52 L603.551,732.278 L593.551,722.278 L520.95,722.278 L516.95,662.738 L512.95,722.278 L430.36,722.278 A0,0 0 0 0 430.36,722.278" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M593.551,722.278 L593.551,732.278 L603.551,732.278 L593.551,722.278" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="436.36" y="739.847" fill="#000" font-size="13" textLength="152.191">Regala las entradas mas</text><text x="436.36" y="755.157" fill="#000" font-size="13" textLength="135.878">baratas del grupo, no</text><text x="436.36" y="770.468" fill="#000" font-size="13" textLength="88.81">las mas caras:</text><text x="436.36" y="785.778" fill="#000" font-size="13" textLength="130.997">"2x1 de toda la vida"</text></g><g class="entity" data-qualified-name="N1" id="ent0028" data-source-line="76"><path d="M6,372.328 L6,504.813 A0,0 0 0 0 6,504.813 L295.15,504.813 L419.09,564.318 L303.15,504.813 L325.905,504.813 A0,0 0 0 0 325.905,504.813 L325.905,382.328 L315.905,372.328 L6,372.328 A0,0 0 0 0 6,372.328" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M315.905,372.328 L315.905,382.328 L325.905,382.328 L315.905,372.328" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="389.897" fill="#000" font-size="13" textLength="290.685">Por que PromocionNxM es la que obliga a que</text><text x="12" y="405.207" fill="#000" font-size="13" textLength="288.431">el descuento sea un monto y no un factor por</text><text x="12" y="420.518" fill="#000" font-size="13" textLength="284.604">butaca: "cada dos entradas, una gratis" no se</text><text x="12" y="435.828" fill="#000" font-size="13" textLength="263.459">puede escribir como multiplicador de una</text><text x="12" y="451.139" fill="#000" font-size="13" textLength="284.667">entrada sola. Con esa unidad comun, las tres</text><text x="12" y="466.449" fill="#000" font-size="13" textLength="296.105">son comparables entre si -hace falta para R15,</text><text x="12" y="481.76" fill="#000" font-size="13" textLength="275.082">que dice que gana la que mas descuenta- y</text><text x="12" y="497.07" fill="#000" font-size="13" textLength="298.905">agregar una cuarta no rompe esa comparacion.</text></g><g class="entity" data-qualified-name="N2" id="ent0030" data-source-line="88"><path d="M795.12,43.488 L795.12,145.352 A0,0 0 0 0 795.12,145.352 L967.95,145.352 L971.95,239.058 L975.95,145.352 L1148.794,145.352 A0,0 0 0 0 1148.794,145.352 L1148.794,53.488 L1138.794,43.488 L795.12,43.488 A0,0 0 0 0 795.12,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1138.794,43.488 L1138.794,53.488 L1148.794,53.488 L1138.794,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="801.12" y="61.057" fill="#000" font-size="13" textLength="158.596" font-weight="700">Cerrado a modificacion:</text><text x="963.829" y="61.057" fill="#000" font-size="13" textLength="92.53">ninguna de las</text><text x="801.12" y="76.367" fill="#000" font-size="13" textLength="251.583">clases existentes cambia para sumar un</text><text x="801.12" y="91.678" fill="#000" font-size="13" textLength="103.994">beneficio nuevo.</text><text x="801.12" y="106.988" fill="#000" font-size="13" textLength="134.075" font-weight="700">Abierto a extension:</text><text x="939.308" y="106.988" fill="#000" font-size="13" textLength="113.591">PromocionBase se</text><text x="801.12" y="122.299" fill="#000" font-size="13" textLength="332.674">extiende con una clase mas, que GestorPromociones</text><text x="801.12" y="137.609" fill="#000" font-size="13" textLength="282.204">ya sabe usar porque solo conoce Promocion.</text></g><!--reverse link Promocion to PromocionBase--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="43" data-link-type="extension"><path d="M971.95,330.508 C971.95,350.668 971.95,358.338 971.95,381.158" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Promocion-backto-PromocionBase" codeLine="43"/><polygon points="971.95,312.508,965.95,330.508,977.95,330.508,971.95,312.508" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link PromocionBase to PromocionPorcentaje--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="44" data-link-type="extension"><path d="M1035.026,509.058 C1057.856,534.218 1072.15,549.958 109