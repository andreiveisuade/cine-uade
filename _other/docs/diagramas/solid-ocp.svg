tyle="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="461.09" cy="442.878" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M463.563,449.021 Q462.982,449.32 462.343,449.47 Q461.704,449.619 460.998,449.619 Q458.491,449.619 457.172,447.967 Q455.852,446.315 455.852,443.194 Q455.852,440.065 457.172,438.413 Q458.491,436.761 460.998,436.761 Q461.704,436.761 462.351,436.911 Q462.999,437.06 463.563,437.359 L463.563,440.081 Q462.932,439.5 462.339,439.231 Q461.745,438.961 461.114,438.961 Q459.77,438.961 459.085,440.027 Q458.4,441.094 458.4,443.194 Q458.4,445.286 459.085,446.353 Q459.77,447.419 461.114,447.419 Q461.745,447.419 462.339,447.15 Q462.932,446.88 463.563,446.299 Z " fill="#000"/><text x="481.59" y="448.169" fill="#000" font-size="14" textLength="103.229">PromocionNxM</text><line x1="383.34" y1="458.878" x2="650.569" y2="458.878" style="stroke:#181818;stroke-width:0.5;"/><text x="388.34" y="476.413" fill="#000" font-size="14" textLength="65.803">-lleva: int</text><text x="388.34" y="492.902" fill="#000" font-size="14" textLength="67.936">-paga: int</text><line x1="383.34" y1="499.855" x2="650.569" y2="499.855" style="stroke:#181818;stroke-width:0.5;"/><text x="388.34" y="517.39" fill="#000" font-size="14" textLength="257.229">+calcularDescuento(entradas): Dinero</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="43"><path d="M1315.63,242.048 L1315.63,296.638 L1112.04,300.638 L1315.63,304.638 L1315.63,359.222 A0,0 0 0 0 1315.63,359.222 L1636.277,359.222 A0,0 0 0 0 1636.277,359.222 L1636.277,252.048 L1626.277,242.048 L1315.63,242.048 A0,0 0 0 0 1315.63,242.048" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1626.277,242.048 L1626.277,252.048 L1636.277,252.048 L1626.277,242.048" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1321.63" y="259.617" fill="#000" font-size="13" textLength="291.478">aplicaA() esta ESCRITA UNA VEZ ACA y las tres</text><text x="1321.63" y="274.927" fill="#000" font-size="13" textLength="276.282">hijas la heredan sin tocarla: vigencia, dia de</text><text x="1321.63" y="290.238" fill="#000" font-size="13" textLength="282.02">semana, horario y medio de pago se evaluan</text><text x="1321.63" y="305.548" fill="#000" font-size="13" textLength="277.272">igual sea cual sea el beneficio. Lo unico que</text><text x="1321.63" y="320.859" fill="#000" font-size="13" textLength="299.647">cada clase decide distinto es cuanto descuenta,</text><text x="1321.63" y="336.169" fill="#000" font-size="13" textLength="276.047">y eso es abstracto: obliga a que cada hija lo</text><text x="1321.63" y="351.48" fill="#000" font-size="13" textLength="137.617">resuelva a su manera.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="53"><path d="M1053.78,599.658 L1053.78,640.279 A0,0 0 0 0 1053.78,640.279 L1196.122,640.279 A0,0 0 0 0 1196.122,640.279 L1196.122,609.658 L1186.122,599.658 L1128.95,599.658 L1124.95,516.268 L1120.95,599.658 L1053.78,599.658 A0,0 0 0 0 1053.78,599.658" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1186.122,599.658 L1186.122,609.658 L1196.122,609.658 L1186.122,599.658" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1059.78" y="617.227" fill="#000" font-size="13" textLength="91.736">% del subtotal:</text><text x="1059.78" y="632.537" fill="#000" font-size="13" textLength="121.342">"miercoles 30% off"</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="57"><path d="M729.75,584.348 L729.75,655.59 A0,0 0 0 0 729.75,655.59 L912.146,655.59 A0,0 0 0 0 912.146,655.59 L912.146,594.348 L902.146,584.348 L824.95,584.348 L820.95,516.268 L816.95,584.348 L729.75,584.348 A0,0 0 0 0 729.75,584.348" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M902.146,584.348 L902.146,594.348 L912.146,594.348 L902.146,584.348" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="735.75" y="601.917" fill="#000" font-size="13" textLength="139.585">Monto fijo, topeado al</text><text x="735.75" y="617.227" fill="#000" font-size="13" textLength="128.458">subtotal para no dar</text><text x="735.75" y="632.538" fill="#000" font-size="13" textLength="118.536">un cobro negativo:</text><text x="735.75" y="647.848" fill="#000" font-size="13" textLength="161.396">"$2000 off con tal banco"</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="63"><path d="M430.36,584.348 L430.36,655.59 A0,0 0 0 0 430.36,655.59 L603.551,655.59 A0,0 0 0 0 603.551,655.59 L603.551,594.348 L593.551,584.348 L520.95,584.348 L516.95,524.808 L512.95,584.348 L430.36,584.348 A0,0 0 0 0 430.36,584.348" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M593.551,584.348 L593.551,594.348 L603.551,594.348 L593.551,584.348" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="436.36" y="601.917" fill="#000" font-size="13" textLength="152.191">Regala las entradas mas</text><text x="436.36" y="617.227" fill="#000" font-size="13" textLength="135.878">baratas del grupo, no</text><text x="436.36" y="632.538" fill="#000" font-size="13" textLength="88.81">las mas caras:</text><text x="436.36" y="647.848" fill="#000" font-size="13" textLength="130.997">"2x1 de toda la vida"</text></g><g class="entity" data-qualified-name="N1" id="ent0025" data-source-line="70"><path d="M6,234.398 L6,366.883 A0,0 0 0 0 6,366.883 L295.15,366.883 L419.09,426.388 L303.15,366.883 L325.905,366.883 A0,0 0 0 0 325.905,366.883 L325.905,244.398 L315.905,234.398 L6,234.398 A0,0 0 0 0 6,234.398" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M315.905,234.398 L315.905,244.398 L325.905,244.398 L315.905,234.398" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="251.967" fill="#000" font-size="13" textLength="290.685">Por que PromocionNxM es la que obliga a que</text><text x="12" y="267.277" fill="#000" font-size="13" textLength="288.431">el descuento sea un monto y no un factor por</text><text x="12" y="282.588" fill="#000" font-size="13" textLength="284.604">butaca: "cada dos entradas, una gratis" no se</text><text x="12" y="297.898" fill="#000" font-size="13" textLength="263.459">puede escribir como multiplicador de una</text><text x="12" y="313.209" fill="#000" font-size="13" textLength="284.667">entrada sola. Con esa unidad comun, las tres</text><text x="12" y="328.519" fill="#000" font-size="13" textLength="296.105">son comparables entre si -hace falta para R15,</text><text x="12" y="343.83" fill="#000" font-size="13" textLength="275.082">que dice que gana la que mas descuenta- y</text><text x="12" y="359.14" fill="#000" font-size="13" textLength="298.905">agregar una cuarta no rompe esa comparacion.</text></g><g class="entity" data-qualified-name="N2" id="ent0027" data-source-line="82"><path d="M792.12,43.488 L792.12,145.352 A0,0 0 0 0 792.12,145.352 L964.95,145.352 L968.95,239.058 L972.95,145.352 L1145.794,145.352 A0,0 0 0 0 1145.794,145.352 L1145.794,53.488 L1135.794,43.488 L792.12,43.488 A0,0 0 0 0 792.12,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1135.794,43.488 L1135.794,53.488 L1145.794,53.488 L1135.794,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="798.12" y="61.057" fill="#000" font-size="13" textLength="158.596" font-weight="700">Cerrado a modificacion:</text><text x="960.829" y="61.057" fill="#000" font-size="13" textLength="92.53">ninguna de las</text><text x="798.12" y="76.367" fill="#000" font-size="13" textLength="251.583">clases existentes cambia para sumar un</text><text x="798.12" y="91.678" fill="#000" font-size="13" textLength="103.994">beneficio nuevo.</text><text x="798.12" y="106.988" fill="#000" font-size="13" textLength="134.075" font-weight="700">Abierto a extension:</text><text x="936.308" y="106.988" fill="#000" font-size="13" textLength="85.065">Promocion se</text><text x="798.12" y="122.299" fill="#000" font-size="13" textLength="332.674">extiende con una clase mas, que GestorPromociones</text><text x="798.12" y="137.609" fill="#000" font-size="13" textLength="282.204">ya sabe usar porque solo conoce Promocion.</text></g><!--reverse link Promocion to PromocionPorcentaje--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk8" data-source-line="38" data-link-type="extension"><path d="M1035.569,375.502 C1057.279,399.562 1069.59,413.228 1089,434.748" style="stroke:#181818;stroke-width:1;" fill="none" id="Promocion-backto-PromocionPorcentaje" codeLine="38"/><polygon points="1023.51,362.138,1031.114,379.522,1040.023,371.483,1023.51,362.138" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Promocion to PromocionMontoFijo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk10" data-source-line="39" data-link-type="extension"><path d="M905.487,375.814 C884.897,399.874 873.48,413.228 855.06,434.748" style="stroke:#181818;stroke-width:1;" fill="none" id="Promocion-backto-PromocionMontoFijo" codeLine="39"/><polygon points="917.19,362.138,900.928,371.913,910.045,379.715,917.19,362.138" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Promocion to PromocionNxM--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk12" data-source-line="40" data-link-type="extension"><path d="M808.819,362.921 C750.119,385.381 699.61,404.718 642.84,426.438" style="stroke:#181818;stroke-width:1;" fill="none" id="Promocion-backto-PromocionNxM" codeLine="40"/><polygon points="825.63,356.488,806.674,357.317,810.963,368.525,825.63,356.488" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src fLPjJzn64Fv-ls9qQXGWToSWwfTJX7e2KY4b547R3rM_ZEqztvBrhhClX6kQ_zvdrZPd896GAY7ENi_hCy_CRDJHABhvxSF5sP9MXLO-kdcflEVAqPoIfK9PjTQbTcIJkdEa0awPIiD1pSWwaIdnJ0s7