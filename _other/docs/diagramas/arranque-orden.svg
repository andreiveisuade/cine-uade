 y son segundos.</text><text x="26.43" y="790.365" fill="#000" font-size="14" textLength="204.258">Antes del healthy del backend</text><text x="239.547" y="790.365" fill="#000" font-size="14" textLength="371.116">localhost:8080 NO responde. No esta roto: el frontend</text><text x="22" y="806.854" fill="#000" font-size="14" textLength="8.859">  </text><text x="239.547" y="806.854" fill="#000" font-size="14" textLength="311.5">todavia no arranco porque espera al backend.</text><text x="26.43" y="823.342" fill="#000" font-size="14" textLength="56.554">Verificar</text><text x="239.547" y="823.342" fill="#000" font-size="14" textLength="406.465">docker compose ps -> los 4 Up, mysql y backend (healthy).</text><text x="26.43" y="839.83" fill="#000" font-size="14" textLength="125.788">Base recien creada</text><text x="239.547" y="839.83" fill="#000" font-size="14" textLength="417.43">No hay datos. Sembrar con ./seed/datos-de-ejemplo.sh, que</text><text x="22" y="856.318" fill="#000" font-size="14" textLength="8.859">  </text><text x="239.547" y="856.318" fill="#000" font-size="14" textLength="391.651">entra por la API y pasa por las mismas reglas del sistema.</text><line x1="22" y1="727.365" x2="692.981" y2="727.365" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="743.854" x2="692.981" y2="743.854" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="760.342" x2="692.981" y2="760.342" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="776.83" x2="692.981" y2="776.83" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="793.318" x2="692.981" y2="793.318" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="809.807" x2="692.981" y2="809.807" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="826.295" x2="692.981" y2="826.295" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="842.783" x2="692.981" y2="842.783" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="859.271" x2="692.981" y2="859.271" style="stroke:#000;stroke-width:1;"/><line x1="22" y1