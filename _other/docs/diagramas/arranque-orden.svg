-size="14" textLength="204.258">Antes del healthy del backend</text><text x="239.547" y="775.055" fill="#000" font-size="14" textLength="371.116">localhost:8080 NO responde. No esta roto: el frontend</text><text x="22" y="791.543" fill="#000" font-size="14" textLength="8.859">  </text><text x="239.547" y="791.543" fill="#000" font-size="14" textLength="311.5">todavia no arranco porque espera al backend.</text><text x="26.43" y="808.031" fill="#000" font-size="14" textLength="56.554">Verificar</text><text x="239.547" y="808.031" fill="#000" font-size="14" textLength="406.465">docker compose ps -> los 4 Up, mysql y backend (healthy).</text><text x="26.43" y="824.52" fill="#000" font-size="14" textLength="125.788">Base recien creada</text><text x="239.547" y="824.52" fill="#000" font-size="14" textLength="417.43">No hay datos. Sembrar con ./seed/datos-de-ejemplo.sh, que</text><text x="22" y="841.008" fill="#000" font-size="14" textLength="8.859">  </text><text x="239.547" y="841.008" fill="#000" font-size="14" textLength="391.651">entra por la API y pasa por las mismas reglas del sistema.</text><line x1="22" y1="712.055" x2="686.453" y2="712.055" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="728.543" x2="686.453" y2="728.543" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="745.031" x2="686.453" y2="745.031" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="761.52" x2="686.453" y2="761.52" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="778.008" x2="686.453" y2="778.008" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="794.496" x2="686.453" y2="794.496" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="810.984" x2="686.453" y2="810.984" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="827.473" x2="686.453" y2="827.473" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="843.961" x2="686.453" y2="843.961" style="stroke:#000;stroke-width:1;"/><line x1="22" y1="712.055" x2="22" y2="843.961" style="stroke:#000;stroke-width:1;"