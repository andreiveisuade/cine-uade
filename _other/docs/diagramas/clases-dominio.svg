<g class="btn-patron" data-patron="Composite" data-color="#c2410c" data-clases="Producto,ProductoSuelto,Combo,ItemCombo,ItemCompra" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#c2410c'&gt;Composite&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;El precio suelto y el ahorro se preguntan igual a un producto suelto o a un combo: la hoja contesta lo suyo y el combo suma sus componentes, sin preguntar esCombo().&lt;/div&gt;&lt;div&gt;&lt;b&gt;Component&lt;/b&gt;: Producto&lt;/div&gt;&lt;div&gt;&lt;b&gt;Leaf&lt;/b&gt;: ProductoSuelto&lt;/div&gt;&lt;div&gt;&lt;b&gt;Composite&lt;/b&gt;: Combo&lt;/div&gt;&lt;div&gt;&lt;b&gt;Child&lt;/b&gt;: ItemCombo&lt;/div&gt;&lt;div&gt;&lt;b&gt;Client&lt;/b&gt;: ItemCompra&lt;/div&gt;"><rect x="182" y="178" width="139" height="34" rx="17" fill="#c2410c"/><text x="251.5" y="201" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Composite</text></g>
<g class="btn-patron" data-patron="State Reserva" data-color="#0f766e" data-clases="Reserva,EstadoReserva" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#0f766e'&gt;State Reserva&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;Qué se puede hacer con una reserva (cobrar, cancelar, vencer, entrar) depende de su estado: cada constante decide su transición y Reserva solo asigna la que le devuelven.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Context&lt;/b&gt;: Reserva&lt;/div&gt;&lt;div&gt;&lt;b&gt;State&lt;/b&gt;: EstadoReserva&lt;/div&gt;"><rect x="333" y="178" width="183" height="34" rx="17" fill="#0f766e"/><text x="424.5" y="201" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">State Reserva</text></g>
<g class="btn-patron" data-patron="State Revisión" data-color="#7c3aed" data-clases="Pelicula,EstadoRevision" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#7c3aed'&gt;State Revisión&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;Si una película se publica, se programa o la ve el público lo decide su estado de revisión, no un if sobre el estado en cada operación.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Context&lt;/b&gt;: Pelicula&lt;/div&gt;&lt;div&gt;&lt;b&gt;State&lt;/b&gt;: EstadoRevision&lt;/div&gt;"><rect x="528" y="178" width="194" height="34" rx="17" fill="#7c3aed"/><text x="625" y="201" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">State Revisión</text></g>
<g class="btn-patron" data-patron="State Importación" data-color="#4338ca" data-clases="Importacion,EstadoImportacion" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#4338ca'&gt;State Importación&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;Solo una corrida en curso puede terminar o fallar: el estado devuelve el siguiente o rechaza, y la importación lo asigna.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Context&lt;/b&gt;: Importacion&lt;/div&gt;&lt;div&gt;&lt;b&gt;State&lt;/b&gt;: EstadoImportacion&lt;/div&gt;"><rect x="734" y="178" width="227" height="34" rx="17" fill="#4338ca"/><text x="847.5" y="201" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">State Importación</text></g>
<g class="btn-patron" data-patron="Factory Method" data-color="#a16207" data-clases="TipoPromocion,Promocion,PromocionPorcentaje,PromocionMontoFijo,PromocionNxM" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#a16207'&gt;Factory Method&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;Cada tipo de promoción sabe crear su subclase: sumar un tipo es una constante y una subclase, sin switch ni instanceof en controller y vistas.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Creator&lt;/b&gt;: TipoPromocion&lt;/div&gt;&lt;div&gt;&lt;b&gt;Product&lt;/b&gt;: Promocion&lt;/div&gt;&lt;div&gt;&lt;b&gt;ConcreteProduct&lt;/b&gt;: PromocionPorcentaje, PromocionMontoFijo, PromocionNxM&lt;/div&gt;"><rect x="973" y="178" width="194" height="34" rx="17" fill="#a16207"/><text x="1070" y="201" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Factory Method</text></g>
