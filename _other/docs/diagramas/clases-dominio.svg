<g class="btn-patron" data-patron="Expert" data-color="#0369a1" data-clases="Reserva,Funcion,FormatoDeFuncion,Proyeccion,Asiento,Programacion,Importacion,Pelicula,MedioPago,Producto,Combo,TipoProducto" data-metodos="Reserva.getTotal,Reserva.pagar,Reserva.cancelar,Reserva.expirar,Reserva.impedimentoParaCobrar,Reserva.estaVencida,Funcion.precioEn,Funcion.precioDe,Funcion.yaEmpezo,FormatoDeFuncion.exigirProyectableEn,Proyeccion.sePuedeProyectarEn,Asiento.getCodigo,Asiento.estaFueraDeServicio,Asiento.exigirEnServicio,Programacion.horariosSinGenerar,Programacion.estaAlDia,Importacion.terminar,Importacion.fallar,Importacion.quedoColgada,Pelicula.dejarPendiente,Pelicula.confirmar,Pelicula.descartar,MedioPago.autorizacion,MedioPago.seCobraEnCaja,Producto.estaDisponible,Producto.editar,Combo.getPrecioSuelto,Combo.getAhorro,TipoProducto.esCombo" data-rel="0" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#0369a1'&gt;Expert&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;La responsabilidad va a la clase que tiene la información: la reserva suma sus entradas y decide sus transiciones, la función calcula el precio con su formato y su sala, el asiento sabe su código y si está en servicio, el medio de pago qué autorización lleva y el combo cuánto ahorra.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Reserva&lt;/b&gt;: getTotal(), pagar(), cancelar(), expirar(), impedimentoParaCobrar(), estaVencida()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Funcion&lt;/b&gt;: precioEn(), precioDe(), yaEmpezo()&lt;/div&gt;&lt;div&gt;&lt;b&gt;FormatoDeFuncion&lt;/b&gt;: exigirProyectableEn()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Proyeccion&lt;/b&gt;: sePuedeProyectarEn()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Asiento&lt;/b&gt;: getCodigo(), estaFueraDeServicio(), exigirEnServicio()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Programacion&lt;/b&gt;: horariosSinGenerar(), estaAlDia()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Importacion&lt;/b&gt;: terminar(), fallar(), quedoColgada()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Pelicula&lt;/b&gt;: dejarPendiente(), confirmar(), descartar()&lt;/div&gt;&lt;div&gt;&lt;b&gt;MedioPago&lt;/b&gt;: autorizacion(), seCobraEnCaja()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Producto&lt;/b&gt;: estaDisponible(), editar()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Combo&lt;/b&gt;: getPrecioSuelto(), getAhorro()&lt;/div&gt;&lt;div&gt;&lt;b&gt;TipoProducto&lt;/b&gt;: esCombo()&lt;/div&gt;"><rect x="182" y="224" width="106" height="34" rx="17" fill="#0369a1"/><text x="235" y="247" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Expert</text></g>
<g class="btn-patron" data-patron="Creator" data-color="#be185d" data-clases="Reserva,Entrada,ButacaPedida,Sala,Asiento,Combo,ItemCombo,CompraCandy,ItemCompra" data-metodos="Reserva.Reserva,Sala.generarAsientos,Combo.armar,CompraCandy.CompraCandy" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#be185d'&gt;Creator&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;Crea quien contiene al objeto creado y tiene los datos para inicializarlo: la reserva crea sus entradas con el precio de su función, la sala sus butacas, el combo sus componentes y la compra del candy sus renglones.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Reserva&lt;/b&gt;: Reserva()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Sala&lt;/b&gt;: generarAsientos()&lt;/div&gt;&lt;div&gt;&lt;b&gt;Combo&lt;/b&gt;: armar()&lt;/div&gt;&lt;div&gt;&lt;b&gt;CompraCandy&lt;/b&gt;: CompraCandy()&lt;/div&gt;"><rect x="300" y="224" width="117" height="34" rx="17" fill="#be185d"/><text x="358.5" y="247" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Creator</text></g>
<g class="btn-patron" data-patron="Polymorphism" data-color="#4d7c0f" data-clases="Promocion,PromocionPorcentaje,PromocionMontoFijo,PromocionNxM,TipoPromocion,EstadoReserva,EstadoRevision,TipoSala,TipoAsiento,TipoTarifa" data-metodos="Promocion.getTipo,Promocion.getParametros,Promocion.calcularDescuento,Promocion.beneficio,Promocion.cambiarParametros,PromocionPorcentaje.getTipo,PromocionPorcentaje.getParametros,PromocionPorcentaje.calcularDescuento,PromocionPorcentaje.beneficio,PromocionPorcentaje.cambiarParametros,PromocionMontoFijo.getTipo,PromocionMontoFijo.getParametros,PromocionMontoFijo.calcularDescuento,PromocionMontoFijo.beneficio,PromocionMontoFijo.cambiarParametros,PromocionNxM.getTipo,PromocionNxM.getParametros,PromocionNxM.calcularDescuento,PromocionNxM.beneficio,PromocionNxM.cambiarParametros,TipoPromocion.crear,EstadoReserva.pagar,EstadoReserva.cancelar,EstadoReserva.expirar,EstadoReserva.ingresar,EstadoReserva.esperaPago,EstadoReserva.ocupaButacas,EstadoReserva.estaPagada,EstadoRevision.exigirPublicable,EstadoRevision.exigirProgramable,EstadoRevision.seMuestraAlPublico,TipoSala.aplicarA,TipoAsiento.aplicarA,TipoTarifa.aplicarA" data-rel="1" data-ficha="&lt;div style='font:600 15px Geist,sans-serif;color:#4d7c0f'&gt;Polymorphism&lt;/div&gt;&lt;div style='margin:4px 0 6px'&gt;Lo que cambia según el tipo lo resuelve el tipo, sin un switch: cada promoción calcula su descuento y dice su beneficio, cada constante de TipoPromocion crea su subclase, cada estado decide su transición y cada tipo de sala, butaca y tarifa aplica su multiplicador.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Promocion&lt;/b&gt;: getTipo(), getParametros(), calcularDescuento(), beneficio(), cambiarParametros()&lt;/div&gt;&lt;div&gt;&lt;b&gt;PromocionPorcentaje&lt;/b&gt;: getTipo(), getParametros(), calcularDescuento(), beneficio(), cambiarParametros()&lt;/div&gt;&lt;div&gt;&lt;b&gt;PromocionMontoFijo&lt;/b&gt;: getTipo(), getParametros(), calcularDescuento(), beneficio(), cambiarParametros()&lt;/div&gt;&lt;div&gt;&lt;b&gt;PromocionNxM&lt;/b&gt;: getTipo(), getParametros(), calcularDescuento(), beneficio(), cambiarParametros()&lt;/div&gt;&lt;div&gt;&lt;b&gt;TipoPromocion&lt;/b&gt;: crear()&lt;/div&gt;&lt;div&gt;&lt;b&gt;EstadoReserva&lt;/b&gt;: pagar(), cancelar(), expirar(), ingresar(), esperaPago(), ocupaButacas(), estaPagada()&lt;/div&gt;&lt;div&gt;&lt;b&gt;EstadoRevision&lt;/b&gt;: exigirPublicable(), exigirProgramable(), seMuestraAlPublico()&lt;/div&gt;&lt;div&gt;&lt;b&gt;TipoSala&lt;/b&gt;: aplicarA()&lt;/div&gt;&lt;div&gt;&lt;b&gt;TipoAsiento&lt;/b&gt;: aplicarA()&lt;/div&gt;&lt;div&gt;&lt;b&gt;TipoTarifa&lt;/b&gt;: aplicarA()&lt;/div&gt;"><rect x="429" y="224" width="172" height="34" rx="17" fill="#4d7c0f"/><text x="515" y="247" text-anchor="middle" font-family="'Geist', -apple-system, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Polymorphism</text></g>
