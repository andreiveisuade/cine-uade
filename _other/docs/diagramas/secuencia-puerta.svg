        <title id="secuencia-puerta-title">Acceso en la puerta</title>
        <desc id="secuencia-puerta-desc">El celular del acomodador escanea el QR y manda el código con Basic; el backend valida al empleado y la reserva en MySQL y registra el ingreso.</desc>
