      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #secuencia-puerta-root { font-family: var(--font-sans); color: var(--color-ink); }
      #secuencia-puerta-root .diagram-container { width: 100%; overflow-x: auto; }
      #secuencia-puerta-root .diagram-container { overflow-x: visible; }</style>
