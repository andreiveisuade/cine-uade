      #secuencia-google-root { font-family: var(--font-sans); color: var(--color-ink); }
      #secuencia-google-root .diagram-container { width: 100%; overflow-x: auto; }
      #secuencia-google-root .diagram-container { overflow-x: visible; }</style>
