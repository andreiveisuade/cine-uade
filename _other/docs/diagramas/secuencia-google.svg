        <title id="secuencia-google-title">Ingresar con Google</title>
        <desc id="secuencia-google-desc">El navegador va a Google y vuelve con un código; el backend lo canjea con el secret, busca o crea al cliente en MySQL y le deja la cookie de sesión.</desc>
