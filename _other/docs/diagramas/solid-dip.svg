55,90.501 22.024,90.501 Q20.68,90.501 19.995,91.568 Q19.31,92.635 19.31,94.735 Q19.31,96.827 19.995,97.893 Q20.68,98.96 22.024,98.96 Q22.655,98.96 23.249,98.69 Q23.842,98.42 24.473,97.839 Z " fill="#000"/><text x="34" y="90.71" fill="#000" font-size="12" textLength="152.203" font-style="italic">«@SpringBootApplication»</text><text x="75.115" y="106.776" fill="#000" font-size="14" textLength="69.973">Aplicacion</text></g><g class="entity" data-qualified-name="N2" id="ent0011" data-source-line="43"><path d="M509.41,43.488 L509.41,145.352 A0,0 0 0 0 509.41,145.352 L592.86,145.352 L476.16,300.868 L600.86,145.352 L762.791,145.352 A0,0 0 0 0 762.791,145.352 L762.791,53.488 L752.791,43.488 L509.41,43.488 A0,0 0 0 0 509.41,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M752.791,43.488 L752.791,53.488 L762.791,53.488 L752.791,43.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="515.41" y="61.057" fill="#000" font-size="13" textLength="182.584">ArquitecturaTest verifica que</text><text x="515.41" y="76.367" fill="#000" font-size="13" textLength="186.469">ningun service/ ni controller/</text><text x="515.41" y="91.678" fill="#000" font-size="13" textLength="176.928">importe jakarta.persistence,</text><text x="515.41" y="106.988" fill="#000" font-size="13" textLength="232.381">java.sql u org.springframework.jdbc.</text><text x="515.41" y="122.299" fill="#000" font-size="13" textLength="216.055">Si alguien se saltea su repositorio,</text><text x="515.41" y="137.609" fill="#000" font-size="13" textLength="109.021">el test lo detecta.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="53"><path d="M222.21,51.148 L222.21,90.418 L187.3,94.418 L222.21,98.418 L222.21,137.701 A0,0 0 0 0 222.21,137.701 L473.998,137.701 A0,0 0 0 0 473.998,137.701 L473.998,61.148 L463.998,51.148 L222.21,51.148 A0,0 0 0 0 222.21,51.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M463.998,51.148 L463.998,61.148 L473.998,61.148 L463.998,51.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="228.21" y="68.717" fill="#000" font-size="13" textLength="230.788">Solo levanta el contenedor de Spring</text><text x="228.21" y="84.027" fill="#000" font-size="13" textLength="221.99">(@SpringBootApplication + main()).</text><text x="228.21" y="99.338" fill="#000" font-size="13" textLength="188.024">Cada @Service, @Repository y</text><text x="228.21" y="114.648" fill="#000" font-size="13" textLength="202.624">@RestController se conecta solo</text><text x="228.21" y="129.959" fill="#000" font-size="13" textLength="133.548">por component scan.</text></g><g class="entity" data-qualified-name="N1" id="ent0017" data-source-line="63"><path d="M69.67,274.078 L69.67,360.631 A0,0 0 0 0 69.67,360.631 L229.9,360.631 L309.99,473.328 L237.9,360.631 L340.539,360.631 A0,0 0 0 0 340.539,360.631 L340.539,284.078 L330.539,274.078 L69.67,274.078 A0,0 0 0 0 69.67,274.078" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M330.539,274.078 L330.539,284.078 L340.539,284.078 L330.539,274.078" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="75.67" y="291.647" fill="#000" font-size="13" textLength="213.383">La flecha de compilacion va en un</text><text x="75.67" y="306.957" fill="#000" font-size="13" textLength="190.201">solo sentido, hacia la interfaz:</text><text x="75.67" y="322.268" fill="#000" font-size="13" textLength="249.869">GestorReservas --> ReservaRepository.</text><text x="75.67" y="337.578" fill="#000" font-size="13" textLength="219.369">No hay ninguna clase de bajo nivel</text><text x="75.67" y="352.889" fill="#000" font-size="13" textLength="176.224">de la que dependa a su vez.</text></g><!--link GestorReservas to ReservaRepository--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk10" data-source-line="40" data-link-type="dependency"><path d="M457.41,333.578 C445.11,361.548 420.163,418.301 398.043,468.601" style