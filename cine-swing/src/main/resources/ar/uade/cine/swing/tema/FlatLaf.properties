# El tema del panel, lo que vale en claro y en oscuro; los colores de cada uno van en su archivo.
# Lo carga FlatLaf.registerCustomDefaultsSource en Colores.usarTema; Properties lee latin-1: los acentos van escapados.

#---- forma ----
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.margin = 4,14,4,14
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.showButtons = false
SplitPaneDivider.style = plain

#---- tablas: sin grilla, filas altas, el texto separado del borde ----
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
Table.cellMargins = 2,10,2,10
Table.cellFocusColor = #00000000
TableHeader.height = 32
TableHeader.cellMargins = 2,10,2,10

#---- pestañas: las del candy y las del planificador ----
TabbedPane.tabHeight = 34
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @accentColor

#---- el menú lateral: botones tipo pestaña con la marca a la izquierda ----
ToggleButton.tab.underlineHeight = 3
ToggleButton.tab.underlineColor = @accentColor

#---- los diálogos de Swing, en castellano ----
OptionPane.okButtonText = Aceptar
OptionPane.cancelButtonText = Cancelar
OptionPane.yesButtonText = S\u00ed
OptionPane.noButtonText = No
FileChooser.saveButtonText = Guardar
FileChooser.openButtonText = Abrir
FileChooser.cancelButtonText = Cancelar
FileChooser.saveDialogTitleText = Guardar
FileChooser.openDialogTitleText = Abrir
FileChooser.fileNameLabelText = Nombre:
FileChooser.filesOfTypeLabelText = Tipo:
FileChooser.lookInLabelText = Buscar en:
FileChooser.saveInLabelText = Guardar en:
FileChooser.acceptAllFileFilterText = Todos los archivos

#---- el botón que avanza: ámbar, uno por pantalla, igual en los dos temas ----
[style]Button.primario = background: #f5b301; foreground: #15171d; borderColor: #f5b301; \
    hoverBackground: #fbc433; hoverBorderColor: #fbc433; pressedBackground: #d99a00; \
    focusedBackground: #f5b301; focusedBorderColor: #fbc433; font: bold
