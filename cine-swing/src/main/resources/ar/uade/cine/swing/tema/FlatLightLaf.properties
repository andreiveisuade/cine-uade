# Claro: el papel de la web (#f4f3ef), campos blancos y el ámbar oscurecido donde va sobre blanco.

@background = #f4f3ef
@foreground = #1e2129
@disabledForeground = #8a8f9c
@componentBackground = #ffffff
@buttonBackground = #ffffff
@accentColor = #d99a00
@selectionBackground = #ffe28a
@selectionForeground = #1e2129
@selectionInactiveBackground = #fff3c4
@selectionInactiveForeground = #5e4200

Component.borderColor = #d6d3c9
Component.disabledBorderColor = #e2dfd6
Separator.foreground = #e2dfd6
Label.disabledForeground = #5b606d

Table.background = #ffffff
Table.alternateRowColor = #f8f7f3
Table.selectionBackground = #ffefb8
Table.selectionForeground = #5e4200
TableHeader.background = #ffffff
TableHeader.foreground = #5b606d
TableHeader.separatorColor = #ffffff
TableHeader.bottomSeparatorColor = #d6d3c9
TableHeader.hoverBackground = #f8f7f3

ToggleButton.tab.selectedBackground = #f3e3b3
ToggleButton.tab.hoverBackground = #e6e3da
TabbedPane.hoverColor = #ebe9e2

Cine.lateral.background = #ebe9e2

[style]Button.peligro = foreground: #c92a2a; borderColor: #f1c4c4; hoverBorderColor: #c92a2a
